[workspace]
resolver = "2"
members = ["crates/*", "tools/*"]
[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.145", features = ["float_roundtrip"] }
toml = "=0.8.23"
thiserror = "=2.0.20"
glam = { version = "=0.29.3", features = ["serde", "bytemuck"] }
rand_chacha = "=0.3.1"
rand_core = "=0.6.4"
bytemuck = { version = "=1.25.0", features = ["derive"] }
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "parking_lot", "vulkan", "metal", "dx12", "wgsl"] }
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06", "x11"] }
egui = "=0.36.2"
egui-wgpu = "=0.36.2"
egui-winit = { version = "=0.36.2", default-features = false, features = ["clipboard", "links", "x11"] }
tracing = "=0.1.41"
tracing-subscriber = { version = "=0.3.20", features = ["env-filter"] }
postcard = { version = "=1.1.3", features = ["alloc", "use-std"] }
directories = "=6.0.0"
proptest = "=1.7.0"
criterion = "=0.5.1"
image = { version = "=0.25.6", default-features = false, features = ["png"] }
pollster = "=0.4.0"
raw-window-handle = "=0.6.2"
clap = { version = "=4.5.48", features = ["derive"] }
sha2 = "=0.10.9"
tempfile = "=3.20.0"
csv = "=1.3.1"
naga = { version = "=30.0.1", features = ["wgsl-in"] }
[profile.release]
lto = "thin"
codegen-units = 1
[profile.bench]
debug = 1
