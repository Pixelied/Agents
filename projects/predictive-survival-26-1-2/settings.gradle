pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

// Disposable verification-branch bootstrap. The real feature branch never contains this.
def routedMarker = new File(settingsDir, '.ci-routed-protection-applied')
if (!routedMarker.exists()) {
    def repoRoot = settingsDir.toPath().resolve('../..').normalize().toFile()
    def command = "cat ci/predictive-survival-hardening/routed2/part-*.b64 | base64 --decode > /tmp/routed-protection.patch && echo '6b87e02bfc6b17b55d0e8923eadc21d1060f5b9e92d165f984958d98e0e0a80a  /tmp/routed-protection.patch' | sha256sum -c - && git apply --3way --whitespace=nowarn /tmp/routed-protection.patch"
    def process = new ProcessBuilder('bash', '-lc', command)
        .directory(repoRoot)
        .redirectErrorStream(true)
        .start()
    def output = process.inputStream.getText('UTF-8')
    def status = process.waitFor()
    if (status != 0) {
        throw new GradleException("Could not apply routed-protection verification patch (${status}):\n${output}")
    }
    routedMarker.text = 'applied\n'
}

rootProject.name = 'predictive-survival-26-1-2'
