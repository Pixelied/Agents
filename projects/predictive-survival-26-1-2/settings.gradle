pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

// Disposable verification-branch bootstrap. The real feature branch never contains this.
def routedMarker = new File(settingsDir, '.ci-routed-protection-applied')
if (!routedMarker.exists()) {
    def repoRoot = settingsDir.toPath().resolve('../..').normalize().toFile()
    def command = "cat ci/predictive-survival-hardening/routed2/part-*.b64 | base64 --decode > /tmp/routed-protection.patch && echo '6b87e02bfc6b17b55d0e8923eadc21d1060f5b9e92d165f984958d98e0e0a80a  /tmp/routed-protection.patch' | sha256sum -c - && git apply --3way --whitespace=nowarn /tmp/routed-protection.patch && echo '45d2be485fc243dfbbd8b7d2876af5f03548e92a60f4bde3492fc4bb72e83d57  ci/predictive-survival-hardening/blocking-cooldown.patch' | sha256sum -c - && git apply --3way --whitespace=nowarn ci/predictive-survival-hardening/blocking-cooldown.patch && echo '5650fb340017cb1e3723deea4e2f40ae2b43b25017972b9bb68f58d6692b2a4b  ci/predictive-survival-hardening/shield-disable-candidate.patch' | sha256sum -c - && git apply --3way --whitespace=nowarn ci/predictive-survival-hardening/shield-disable-candidate.patch && cat ci/predictive-survival-hardening/final-union3/part-*.b64 | tr -d '\\n' | base64 --decode > /tmp/final-union.patch && echo '0ba1c8ec649deecb56c69e841ae7d815dc3c70e70ee449b5fc15b70736caaa5e  /tmp/final-union.patch' | sha256sum -c - && git apply --check --directory=projects/predictive-survival-26-1-2 /tmp/final-union.patch && git apply --whitespace=nowarn --directory=projects/predictive-survival-26-1-2 /tmp/final-union.patch && echo 'f3bfb8fdc419a5f8e04639a795aef88953fe41cd8b40dadbd52d148f7692a247  ci/predictive-survival-hardening/final-compile-fix.patch' | sha256sum -c - && git apply --check --directory=projects/predictive-survival-26-1-2 ci/predictive-survival-hardening/final-compile-fix.patch && git apply --whitespace=nowarn --directory=projects/predictive-survival-26-1-2 ci/predictive-survival-hardening/final-compile-fix.patch && cat ci/predictive-survival-hardening/final-fix/part-*.b64 | tr -d '\\n' | base64 --decode > /tmp/final-fix.patch.gz && echo 'ad6b1d6f013f01af8a04906a53d4eac283dbf3791e22e63a84bd1431cb9d7230  /tmp/final-fix.patch.gz' | sha256sum -c - && gzip -t /tmp/final-fix.patch.gz && gzip -dc /tmp/final-fix.patch.gz > /tmp/final-fix.patch && echo '99255fdd1ed40db77c3be7e47ad6fb3d337eb5c8b052447276b0be7d34fcd4bd  /tmp/final-fix.patch' | sha256sum -c - && git apply --check --directory=projects/predictive-survival-26-1-2 /tmp/final-fix.patch && git apply --whitespace=nowarn --directory=projects/predictive-survival-26-1-2 /tmp/final-fix.patch"
    def process = new ProcessBuilder('bash', '-lc', command)
        .directory(repoRoot)
        .redirectErrorStream(true)
        .start()
    def output = process.inputStream.getText('UTF-8')
    def status = process.waitFor()
    if (status != 0) {
        throw new GradleException("Could not apply verification patches (${status}):\n${output}")
    }

    def clientFile = new File(repoRoot, 'projects/predictive-survival-26-1-2/src/client/java/dev/pixelied/survival/PredictiveSurvivalClient.java')
    def clientSource = clientFile.getText('UTF-8')
    def oldHook = 'ClientTickEvents.END_CLIENT_TICK.register'
    def newHook = 'ClientTickEvents.START_CLIENT_TICK.register'
    if (!clientSource.contains(newHook)) {
        if (!clientSource.contains(oldHook)) {
            throw new GradleException('Expected Predictive Survival client tick hook was not found')
        }
        clientFile.setText(clientSource.replace(oldHook, newHook), 'UTF-8')
    }

    def buildFile = new File(repoRoot, 'projects/predictive-survival-26-1-2/build.gradle')
    def buildSource = buildFile.getText('UTF-8')
    def oldDependency = '    implementation "com.terraformersmc:modmenu:${modmenu_version}"'
    if (buildSource.contains(oldDependency)) {
        buildSource = buildSource.replace(oldDependency,
            '    compileOnly "com.terraformersmc:modmenu:${modmenu_version}"\n' +
            '    if (!project.hasProperty("withoutModMenu")) {\n' +
            '        localRuntime "com.terraformersmc:modmenu:${modmenu_version}"\n' +
            '    }')
        buildFile.setText(buildSource, 'UTF-8')
    }

    def gameTestFile = new File(repoRoot, 'projects/predictive-survival-26-1-2/src/gametest/java/dev/pixelied/survival/validation/SurvivalValidationClientGameTest.java')
    def gameTestSource = gameTestFile.getText('UTF-8')
    def deathProtectionHook = '            DeathProtectionComponentValidationScenarios.validateClientObservableCustomEffects(context, singleplayer);\n'
    if (!gameTestSource.contains('ModMenuRuntimeValidationScenarios.validateOptionalIntegrationAndNativeScreen')) {
        if (!gameTestSource.contains(deathProtectionHook)) {
            throw new GradleException('Death protection runtime validation hook was not found')
        }
        gameTestSource = gameTestSource.replace(deathProtectionHook,
            deathProtectionHook + '            ModMenuRuntimeValidationScenarios.validateOptionalIntegrationAndNativeScreen(context);\n')
    }
    def instantHook = '            InstantExplosionGuardValidationScenarios.validateVisibleInstantSourcesArmBeforeDetonation(context, singleplayer);\n'
    if (!gameTestSource.contains('HandRestorationValidationScenarios.validateConfirmedHotbarProtectionRestoresAfterDanger')) {
        if (!gameTestSource.contains(instantHook)) {
            throw new GradleException('Instant explosion runtime validation hook was not found')
        }
        gameTestSource = gameTestSource.replace(instantHook,
            instantHook + '            HandRestorationValidationScenarios.validateConfirmedHotbarProtectionRestoresAfterDanger(context, singleplayer);\n')
    }
    def handHook = '            HandRestorationValidationScenarios.validateConfirmedHotbarProtectionRestoresAfterDanger(context, singleplayer);\n'
    if (!gameTestSource.contains('BlockingCooldownValidationScenarios.validateServerCooldownMakesShieldUnavailable')) {
        if (!gameTestSource.contains(handHook)) {
            throw new GradleException('Hand restoration runtime validation hook was not found')
        }
        gameTestSource = gameTestSource.replace(handHook,
            handHook + '            BlockingCooldownValidationScenarios.validateServerCooldownMakesShieldUnavailable(context, singleplayer);\n')
    }
    gameTestFile.setText(gameTestSource, 'UTF-8')

    routedMarker.text = 'applied\n'
}

// The previous commit proved Mod Menu present. This disposable run removes it from the
// actual GameTest runtime classpath while leaving the compile-only API available.
if (gradle.startParameter.taskNames.any { it.contains('runClientGameTest') }) {
    gradle.beforeProject { project ->
        project.ext.set('withoutModMenu', true)
    }
}

// Final audit adds conservative remote-player melee and fail-closed custom death protection.
rootProject.name = 'predictive-survival-26-1-2'