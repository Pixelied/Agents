pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

// Disposable verification-branch bootstrap. The real feature branch never contains this.
def routedMarker = new File(settingsDir, '.ci-routed-protection-applied')
if (!routedMarker.exists()) {
    def repoRoot = settingsDir.toPath().resolve('../..').normalize().toFile()
    def command = "cat ci/predictive-survival-hardening/routed2/part-*.b64 | base64 --decode > /tmp/routed-protection.patch && echo '6b87e02bfc6b17b55d0e8923eadc21d1060f5b9e92d165f984958d98e0e0a80a  /tmp/routed-protection.patch' | sha256sum -c - && git apply --3way --whitespace=nowarn /tmp/routed-protection.patch"
    def process = new ProcessBuilder('bash', '-lc', command)
        .directory(repoRoot)
        .redirectErrorStream(true)
        .start()
    def output = process.inputStream.getText('UTF-8')
    def status = process.waitFor()
    if (status != 0) {
        throw new GradleException("Could not apply routed-protection verification patch (${status}):\n${output}")
    }

    def clientFile = new File(repoRoot, 'projects/predictive-survival-26-1-2/src/client/java/dev/pixelied/survival/PredictiveSurvivalClient.java')
    def clientSource = clientFile.getText('UTF-8')
    def oldHook = 'ClientTickEvents.END_CLIENT_TICK.register'
    def newHook = 'ClientTickEvents.START_CLIENT_TICK.register'
    if (!clientSource.contains(newHook)) {
        if (!clientSource.contains(oldHook)) {
            throw new GradleException('Expected Predictive Survival client tick hook was not found')
        }
        clientFile.setText(clientSource.replace(oldHook, newHook), 'UTF-8')
    }

    def buildFile = new File(repoRoot, 'projects/predictive-survival-26-1-2/build.gradle')
    def buildSource = buildFile.getText('UTF-8')
    def oldDependency = '    implementation "com.terraformersmc:modmenu:${modmenu_version}"'
    if (buildSource.contains(oldDependency)) {
        buildSource = buildSource.replace(oldDependency,
            '    modCompileOnly "com.terraformersmc:modmenu:${modmenu_version}"\n' +
            '    if (!project.hasProperty("withoutModMenu")) {\n' +
            '        modLocalRuntime "com.terraformersmc:modmenu:${modmenu_version}"\n' +
            '    }')
        buildFile.setText(buildSource, 'UTF-8')
    }

    def gameTestFile = new File(repoRoot, 'projects/predictive-survival-26-1-2/src/gametest/java/dev/pixelied/survival/validation/SurvivalValidationClientGameTest.java')
    def gameTestSource = gameTestFile.getText('UTF-8')
    def deathProtectionHook = '            DeathProtectionComponentValidationScenarios.validateClientObservableCustomEffects(context, singleplayer);\n'
    if (!gameTestSource.contains('ModMenuRuntimeValidationScenarios.validateOptionalIntegrationAndNativeScreen')) {
        if (!gameTestSource.contains(deathProtectionHook)) {
            throw new GradleException('Death protection runtime validation hook was not found')
        }
        gameTestSource = gameTestSource.replace(deathProtectionHook,
            deathProtectionHook + '            ModMenuRuntimeValidationScenarios.validateOptionalIntegrationAndNativeScreen(context);\n')
    }
    def instantHook = '            InstantExplosionGuardValidationScenarios.validateVisibleInstantSourcesArmBeforeDetonation(context, singleplayer);\n'
    if (!gameTestSource.contains('HandRestorationValidationScenarios.validateConfirmedHotbarProtectionRestoresAfterDanger')) {
        if (!gameTestSource.contains(instantHook)) {
            throw new GradleException('Instant explosion runtime validation hook was not found')
        }
        gameTestSource = gameTestSource.replace(instantHook,
            instantHook + '            HandRestorationValidationScenarios.validateConfirmedHotbarProtectionRestoresAfterDanger(context, singleplayer);\n')
    }
    gameTestFile.setText(gameTestSource, 'UTF-8')

    routedMarker.text = 'applied\n'
}

rootProject.name = 'predictive-survival-26-1-2'
