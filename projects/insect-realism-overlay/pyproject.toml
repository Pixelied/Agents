[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "insect-realism-research"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["numpy>=2,<3", "pandas>=2.2,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
