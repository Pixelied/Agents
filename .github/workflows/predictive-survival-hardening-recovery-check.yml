name: Predictive Survival Hardening Recovery Check

on:
  push:
    branches:
      - ci/predictive-survival-hardening-recovery-check

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout transport branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and apply recovered hardening
        shell: bash
        run: |
          set -euo pipefail
          cat .ci/predictive-survival-hardening/patch-00.b64 \
              .ci/predictive-survival-hardening/patch-01.b64 \
              .ci/predictive-survival-hardening/patch-02.b64 \
              .ci/predictive-survival-hardening/patch-03.b64 \
              .ci/predictive-survival-hardening/patch-04.b64 \
              .ci/predictive-survival-hardening/patch-05.b64 \
              .ci/predictive-survival-hardening/patch-06.b64 \
              .ci/predictive-survival-hardening/patch-07.b64 \
              > /tmp/predictive-survival-hardening.patch.gz.b64
          base64 -d /tmp/predictive-survival-hardening.patch.gz.b64 > /tmp/predictive-survival-hardening.patch.gz
          echo '41b985bc1729b0fde4498f93e117b8ba7ac89f68ee56085de22cce3372ca2d92  /tmp/predictive-survival-hardening.patch.gz' | sha256sum -c -
          gzip -t /tmp/predictive-survival-hardening.patch.gz
          git config user.name 'Predictive Survival CI'
          git config user.email 'actions@users.noreply.github.com'
          gzip -dc /tmp/predictive-survival-hardening.patch.gz | git am --3way
          git status --short
          git log --oneline -10

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Unit tests and production build
        working-directory: projects/predictive-survival-26-1-2
        run: gradle --no-daemon --console=plain clean test build

      - name: Compile client GameTests
        working-directory: projects/predictive-survival-26-1-2
        run: gradle --no-daemon --console=plain compileGametestJava processGametestResources

      - name: Run exact-runtime client GameTests
        timeout-minutes: 8
        working-directory: projects/predictive-survival-26-1-2
        shell: bash
        run: |
          set +e
          xvfb-run -a gradle --no-daemon --console=plain runClientGameTest > gametest-console.log 2>&1
          status=$?
          set -e
          tail -n 160 gametest-console.log || true
          exit "$status"

      - name: Verify production jar isolation
        if: success()
        working-directory: projects/predictive-survival-26-1-2
        shell: bash
        run: |
          set -euo pipefail
          jar_file=$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' | head -n 1)
          test -n "$jar_file"
          if jar tf "$jar_file" | grep -q '^dev/pixelied/survival/validation/'; then
            echo 'GameTest validation classes leaked into production jar'
            exit 1
          fi
          echo "production jar isolation OK: $jar_file"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: predictive-survival-hardening-recovery-diagnostics
          if-no-files-found: ignore
          path: |
            projects/predictive-survival-26-1-2/gametest-console.log
            projects/predictive-survival-26-1-2/run/logs/latest.log
            projects/predictive-survival-26-1-2/build/reports/tests/**
