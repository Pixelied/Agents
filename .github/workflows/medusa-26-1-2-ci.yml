name: Medusa 26.1.2 CI

on:
  push:
    branches: ["main", "feat/medusa-26-1-2"]
    paths:
      - "projects/medusa-26-1-2/**"
      - ".github/workflows/medusa-26-1-2-ci.yml"
  pull_request:
    paths:
      - "projects/medusa-26-1-2/**"
      - ".github/workflows/medusa-26-1-2-ci.yml"

jobs:
  static-contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/medusa-26-1-2
    steps:
      - uses: actions/checkout@v4
      - name: Run contract tests
        run: python3 -m unittest discover -s tests -v
      - name: Run static validator
        run: python3 scripts/validate_medusa.py

  exact-runtime:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/medusa-26-1-2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Fetch exact Minecraft 26.1.2 dedicated server
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run/world/datapacks
          curl -fsSL https://piston-meta.mojang.com/mc/game/version_manifest_v2.json -o run/version_manifest.json
          VERSION_URL=$(python3 - <<'PY'
          import json
          data=json.load(open('run/version_manifest.json'))
          print(next(v['url'] for v in data['versions'] if v['id']=='26.1.2'))
          PY
          )
          curl -fsSL "$VERSION_URL" -o run/version.json
          SERVER_URL=$(python3 - <<'PY'
          import json
          data=json.load(open('run/version.json'))
          assert data['id']=='26.1.2'
          assert data['javaVersion']['majorVersion']==25
          print(data['downloads']['server']['url'])
          PY
          )
          EXPECTED_SHA1=$(python3 - <<'PY'
          import json
          print(json.load(open('run/version.json'))['downloads']['server']['sha1'])
          PY
          )
          curl -fsSL "$SERVER_URL" -o run/server.jar
          echo "$EXPECTED_SHA1  run/server.jar" | sha1sum -c -
          cp -R datapacks/medusa run/world/datapacks/medusa
          printf 'eula=true\n' > run/eula.txt
          printf 'online-mode=false\nlevel-name=world\nspawn-protection=0\n' > run/server.properties
      - name: Boot server and exercise Medusa runtime
        shell: bash
        run: |
          set -euo pipefail
          cd run
          {
            sleep 40
            echo 'function medusa:debug/create_test_temple'
            sleep 3
            echo 'execute if entity @e[type=minecraft:marker,tag=md.instance,limit=1] run say MEDUSA_INSTANCE_OK'
            echo 'execute unless entity @e[type=minecraft:marker,tag=md.instance,limit=1] run say MEDUSA_INSTANCE_MISSING'
            echo 'function medusa:debug/start_test_boss'
            sleep 2
            echo 'execute if entity @e[tag=md.boss,limit=1] run say MEDUSA_BOSS_OK'
            echo 'execute unless entity @e[tag=md.boss,limit=1] run say MEDUSA_BOSS_MISSING'
            echo 'data get entity @e[tag=md.boss,limit=1] Health'
            echo 'scoreboard players get @e[tag=md.boss,limit=1] md_phase'
            echo 'function medusa:debug/give_test_items'
            echo 'function medusa:debug/test_petrification_damage'
            sleep 2
            echo 'forceload remove all'
            echo 'stop'
          } | timeout 100s java -Xms512M -Xmx1G -jar server.jar nogui | tee server.log
          grep -q 'Done (' server.log
          grep -q 'MEDUSA_INSTANCE_OK' server.log
          grep -q 'MEDUSA_BOSS_OK' server.log
          grep -q 'MEDUSA_PETRIFICATION_DAMAGE_OK' server.log
          ! grep -Eq 'MEDUSA_INSTANCE_MISSING|MEDUSA_BOSS_MISSING|MEDUSA_PETRIFICATION_DAMAGE_FAILED' server.log
          ! grep -Eq 'Unknown function|Unknown or incomplete command|Failed to load|Errors in currently selected data packs|Could not load' server.log

  package:
    needs: [static-contracts, exact-runtime]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build distributable ZIP
        shell: bash
        run: |
          set -euo pipefail
          cd projects/medusa-26-1-2
          zip -qr "$GITHUB_WORKSPACE/medusa-26.1.2-latest.zip" . \
            -x 'run/*' '__pycache__/*' '*.pyc' '.DS_Store'
      - uses: actions/upload-artifact@v4
        with:
          name: medusa-26.1.2-latest
          path: medusa-26.1.2-latest.zip
          if-no-files-found: error
