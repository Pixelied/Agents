name: Insect continuation - exact Cargo lock publication
"on":
  push:
    branches: ['feat/insect-continuation-03-q7b4']
    paths:
      - '.github/workflows/insect-continuation-native.yml'
      - 'projects/insect-realism-desktop-app/scripts/recovery/Cargo.lock.patch'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: insect-resume-m5r2-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish-original-lock:
    if: github.repository == 'Pixelied/Agents' && github.ref == 'refs/heads/feat/insect-continuation-03-q7b4'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - name: Preserve exact source line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Retrieve the existing dependency-lock transport artifact
        uses: actions/download-artifact@v4
        with:
          name: insect-offline-toolchain-m5r2
          run-id: 35404293846
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/insect-lock-source
      - name: Reconstruct and authenticate the original checkpoint lockfile
        shell: bash
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/insect-lock-source/dependency-fetch.lock"
          echo "a8f6f166ef118c3dd15d6c73abd091b0d3a2399d2c94139afb454acb57d2e3ba  $SRC" | sha256sum --check
          mkdir "$RUNNER_TEMP/insect-lock-recovery"
          cp "$SRC" "$RUNNER_TEMP/insect-lock-recovery/Cargo.lock"
          PATCH="$GITHUB_WORKSPACE/projects/insect-realism-desktop-app/scripts/recovery/Cargo.lock.patch"
          git -C "$RUNNER_TEMP/insect-lock-recovery" apply --check "$PATCH"
          git -C "$RUNNER_TEMP/insect-lock-recovery" apply "$PATCH"
          RECOVERED="$RUNNER_TEMP/insect-lock-recovery/Cargo.lock"
          echo "d8ab5fba9f4b3f1cbba35485e748792f68ca9a34d2c45c393e2c062fa1cdd883  $RECOVERED" | sha256sum --check
          DEST="projects/insect-realism-desktop-app/app/Cargo.lock"
          if test -e "$DEST"; then
            cmp "$RECOVERED" "$DEST"
          else
            cp "$RECOVERED" "$DEST"
          fi
      - name: Commit only the verified ordinary Cargo.lock source file
        shell: bash
        run: |
          set -euo pipefail
          DEST="projects/insect-realism-desktop-app/app/Cargo.lock"
          git add -- "$DEST"
          if git diff --cached --quiet; then
            echo 'The exact original Cargo.lock is already present.'
            exit 0
          fi
          test "$(git diff --cached --name-only)" = "$DEST"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: publish exact checkpoint Cargo.lock without resolving new versions'
          git push origin "HEAD:$GITHUB_REF_NAME"
          echo 'Published the exact original lockfile. This import is not a build or a release qualification.' >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve the authenticated lockfile as evidence
        uses: actions/upload-artifact@v4
        with:
          name: insect-original-cargo-lock-m5r2
          path: projects/insect-realism-desktop-app/app/Cargo.lock
          if-no-files-found: error
          retention-days: 30
