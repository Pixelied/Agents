name: Vape 4.21 Fabric runtime-safe build
on:
  push:
    branches:
      - project/vape421-fabric-clean-build-20261123
    paths:
      - 'projects/vape421-fabric-clean-build/**'
      - '.github/workflows/vape421-fabric-clean-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            name: macos-arm64
          - runner: windows-2022
            name: windows-x64
          - runner: ubuntu-24.04
            name: linux-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - name: Preserve original source line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: xiaoyu777-coder/VapeV4.21
          ref: 5a6ff6ca04c62f32aebf6eee0c983c1a1a5602c4
          path: recovered
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply and check original-source overlay
        run: python projects/vape421-fabric-clean-build/prepare.py recovered
      - name: Build and validate package (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        working-directory: recovered
        run: bash gradlew --no-daemon --stacktrace clean check verifyFabricJar
      - name: Build and validate package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: recovered
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "Visual Studio C++ build tools not found" }
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          Set-Content -LiteralPath build-ci.cmd -Encoding ascii -Value @(
            ('@call "' + $vcvars + '"'),
            '@if errorlevel 1 exit /b 1',
            '@call gradlew.bat --no-daemon --stacktrace clean check verifyFabricJar',
            '@exit /b %ERRORLEVEL%'
          )
          cmd.exe /d /c build-ci.cmd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Verify archive and run packaged native bridge smoke test
        run: python projects/vape421-fabric-clean-build/verify.py recovered
      - uses: actions/upload-artifact@v4
        with:
          name: vape421-fabric-${{ matrix.name }}
          path: |
            recovered/build/libs/vape421-fabric-4.21-*.jar
            recovered/build/libs/vape421-fabric-4.21-*.jar.sha256
          if-no-files-found: error
          retention-days: 14
