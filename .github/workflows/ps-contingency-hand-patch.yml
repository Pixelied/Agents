name: Apply Predictive Survival hand-state patch

on:
  push:
    branches:
      - feat/predictive-survival-contingency-planner

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/predictive-survival-contingency-planner
          fetch-depth: 0
      - name: Apply exact hand-state fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          action = Path('projects/predictive-survival-26-1-2/src/client/java/dev/pixelied/survival/planner/SurvivalAction.java')
          text = action.read_text()
          old = '''            return copy(\n                player, player.health(), player.absorption(), player.mitigation(), player.statusEffects(),\n                player.blocking(), next, player.equipmentItemKeys()\n            );\n'''
          new = '''            BlockingSnapshot nextBlocking = player.blocking();\n            String targetSlot = hand == Hand.MAIN_HAND ? "mainhand" : "offhand";\n            if ("minecraft:shield".equals(player.equipmentItemKeys().get(targetSlot))) {\n                nextBlocking = BlockingSnapshot.none();\n            }\n            return copy(\n                player, player.health(), player.absorption(), player.mitigation(), player.statusEffects(),\n                nextBlocking, next, player.equipmentItemKeys()\n            );\n'''
          if old not in text:
              raise SystemExit('EquipDeathProtection apply target changed; refusing blind patch')
          action.write_text(text.replace(old, new, 1))

          generator = Path('projects/predictive-survival-26-1-2/src/client/java/dev/pixelied/survival/planner/SurvivalCandidateGenerator.java')
          text = generator.read_text()
          old = '''        boolean activeOffhand = inventory.activeOffhandShield()\n            && inventory.slot(40).map(slot -> !slot.blockingOnCooldown()).orElse(false);\n        boolean selectedMainhandShield = inventory.slot(inventory.selectedHotbarIndex())\n            .map(slot -> slot.count() > 0\n                && "minecraft:shield".equals(slot.stackKey())\n                && !slot.blockingOnCooldown())\n            .orElse(false);\n\n        if (activeOffhand || selectedMainhandShield) {\n            BlockingSnapshot blocking = context.player().blocking();\n            int elapsed = activeOffhand ? blocking.elapsedUseTicks() : 0;\n            int required = activeOffhand\n                ? Math.max(blocking.requiredUseTicks(), SHIELD_WARMUP_TICKS)\n                : SHIELD_WARMUP_TICKS;\n            int requiredServerTicks = activeOffhand && elapsed >= required ? 0 : Math.max(0, required - elapsed);\n\n            java.util.Optional<dev.pixelied.survival.damage.BlockingProfileSnapshot> profile = activeOffhand\n                ? context.player().blocking().profile().or(() -> inventory.slot(40).flatMap(InventorySlotSnapshot::blockingProfile))\n                : inventory.slot(inventory.selectedHotbarIndex()).flatMap(InventorySlotSnapshot::blockingProfile);\n\n            candidates.add(new SurvivalAction.RaiseShield(\n                requiredServerTicks,\n                true,\n                true,\n                true,\n                1d,\n                profile.isPresent() ? 0f : 1f,\n                elapsed,\n                required,\n                0,\n                profile\n            ));\n            return;\n        }\n'''
          new = '''        InventorySlotSnapshot offhand = inventory.slot(40).orElse(null);\n        boolean heldOffhandShield = offhand != null\n            && offhand.count() > 0\n            && "minecraft:shield".equals(offhand.stackKey())\n            && offhand.blockingProfile().isPresent()\n            && !offhand.blockingOnCooldown();\n        boolean activeOffhand = inventory.activeOffhandShield() && heldOffhandShield;\n        InventorySlotSnapshot selected = inventory.slot(inventory.selectedHotbarIndex()).orElse(null);\n        boolean selectedMainhandShield = selected != null\n            && selected.count() > 0\n            && "minecraft:shield".equals(selected.stackKey())\n            && selected.blockingProfile().isPresent()\n            && !selected.blockingOnCooldown();\n\n        if (heldOffhandShield || selectedMainhandShield) {\n            BlockingSnapshot blocking = context.player().blocking();\n            int elapsed = activeOffhand ? blocking.elapsedUseTicks() : 0;\n            int required = activeOffhand\n                ? Math.max(blocking.requiredUseTicks(), SHIELD_WARMUP_TICKS)\n                : SHIELD_WARMUP_TICKS;\n            int requiredServerTicks = activeOffhand && elapsed >= required ? 0 : Math.max(0, required - elapsed);\n\n            InventorySlotSnapshot shieldSlot = heldOffhandShield ? offhand : selected;\n            SurvivalAction.Hand shieldHand = heldOffhandShield\n                ? SurvivalAction.Hand.OFF_HAND\n                : SurvivalAction.Hand.MAIN_HAND;\n            java.util.Optional<dev.pixelied.survival.damage.BlockingProfileSnapshot> profile = activeOffhand\n                ? context.player().blocking().profile().or(shieldSlot::blockingProfile)\n                : shieldSlot.blockingProfile();\n            SurvivalItemRoute heldRoute = new SurvivalItemRoute.AlreadyHeld(\n                shieldHand, shieldSlot.stackKey(), shieldSlot.componentFingerprint()\n            );\n\n            candidates.add(new SurvivalAction.RaiseShield(\n                requiredServerTicks,\n                true,\n                true,\n                true,\n                1d,\n                profile.isPresent() ? 0f : 1f,\n                elapsed,\n                required,\n                0,\n                profile,\n                java.util.Optional.of(new SurvivalAction.HeldItemRef(\n                    shieldHand, shieldSlot.stackKey(), shieldSlot.componentFingerprint(), java.util.Optional.of(heldRoute)\n                ))\n            ));\n            return;\n        }\n'''
          if old not in text:
              raise SystemExit('held-shield target changed; refusing blind patch')
          generator.write_text(text.replace(old, new, 1))
          PY
      - name: Commit patch and remove helper workflow
        run: |
          rm .github/workflows/ps-contingency-hand-patch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add projects/predictive-survival-26-1-2/src/client/java/dev/pixelied/survival/planner/SurvivalAction.java \
                  projects/predictive-survival-26-1-2/src/client/java/dev/pixelied/survival/planner/SurvivalCandidateGenerator.java \
                  .github/workflows/ps-contingency-hand-patch.yml
          git commit -m 'fix: preserve physical hand state in contingencies'
          git push origin HEAD:feat/predictive-survival-contingency-planner
