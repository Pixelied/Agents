name: Pearl Catcher definitive release gate

on:
  push:
    branches: [fix/pearl-catcher-26-1-2-hardening]
    paths: [.github/workflows/pearl-catcher-finalize3.yml]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/pearl-catcher-26-1-2-hardening

      - name: Resolve hardened head
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin refs/heads/fix/pearl-catcher-26-1-2-hardening
          git checkout --detach FETCH_HEAD
          git cat-file -e HEAD:projects/pearl-catcher-26-1-2/build.gradle
          git cat-file -e HEAD:projects/pearl-catcher-26-1-2/src/main/java/studio/pixelied/pearlcatch/core/GeneralCatchSolver.java
          git cat-file -e HEAD:.github/workflows/pearl-catcher-26-1-2-ci.yml
          echo "TARGET_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Source regression suite
        working-directory: projects/pearl-catcher-26-1-2
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/*.sh
          ./scripts/run-core-tests.sh
          for script in scripts/test-*.sh; do
            case "$script" in *test-event-class-abi.sh) continue ;; esac
            bash "$script"
          done

      - name: Build Fabric production artifact
        working-directory: projects/pearl-catcher-26-1-2
        run: gradle clean build --stacktrace

      - name: Post-build ABI and JAR audit
        working-directory: projects/pearl-catcher-26-1-2
        shell: bash
        run: |
          set -euo pipefail
          jar='build/libs/Pixelied-Studio-Pearl-Catcher-2.5.2.jar'
          test -f "$jar"
          bash scripts/test-event-class-abi.sh "$jar"
          bash scripts/verify-manual-abi.sh build/classes/java/client
          jar tf "$jar" > build/production-jar-contents.txt
          for cls in CatchCoordinator VanillaInputExecutor ProjectileTracker RuntimePathSafety; do
            grep -F "studio/pixelied/pearlcatch/${cls}.class" build/production-jar-contents.txt >/dev/null
          done
          if grep -F 'studio/pixelied/pearlcatch/CatchExecutor.class' build/production-jar-contents.txt >/dev/null; then
            echo 'Legacy CatchExecutor survived refactor' >&2; exit 1
          fi
          if grep -E '\.(java|zip)$|GeneralCatchSolverSelfTest' build/production-jar-contents.txt >/dev/null; then
            echo 'Source/test junk found in production JAR' >&2; exit 1
          fi

      - name: Shared workspace tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -v
          python agentctl.py validate

      - name: Verify PR scope
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh pr view 29 --repo "$GITHUB_REPOSITORY" --json files --jq '.files[].path' | while IFS= read -r path; do
            case "$path" in
              projects/pearl-catcher-26-1-2/*|.github/workflows/pearl-catcher-26-1-2-ci.yml|docs/superpowers/specs/2026-08-22-pearl-catcher-26-1-2-hardening-design.md|docs/superpowers/plans/2026-08-22-pearl-catcher-26-1-2-hardening.md|.github/workflows/pearl-catcher-bootstrap*.yml|.github/workflows/pearl-catcher-finalize*.yml) ;;
              *) echo "Unexpected PR path: $path" >&2; exit 1 ;;
            esac
          done

      - name: Upload verified production JAR
        uses: actions/upload-artifact@v4
        with:
          name: pearl-catcher-2.5.2-verified
          path: projects/pearl-catcher-26-1-2/build/libs/Pixelied-Studio-Pearl-Catcher-2.5.2.jar
          if-no-files-found: error

      - name: Remove one-shot workflow and merge PR
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: fix/pearl-catcher-26-1-2-hardening
        shell: bash
        run: |
          set -euo pipefail
          path='.github/workflows/pearl-catcher-finalize3.yml'
          if file_sha=$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=$BRANCH" --jq .sha 2>/dev/null); then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/contents/$path" \
              -f message='ci: remove one-shot Pearl Catcher release gate' \
              -f sha="$file_sha" -f branch="$BRANCH" >/dev/null
          fi
          state=$(gh pr view 29 --repo "$GITHUB_REPOSITORY" --json state,mergedAt --jq 'if .mergedAt != null then "MERGED" else .state end')
          if [ "$state" = OPEN ]; then
            gh pr ready 29 --repo "$GITHUB_REPOSITORY" || true
            gh pr merge 29 --repo "$GITHUB_REPOSITORY" --squash --delete-branch=false
          elif [ "$state" != MERGED ]; then
            echo "PR #29 is closed without merge" >&2
            exit 1
          fi

      - name: Close Agents coordination state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B pearl-close origin/main
          task='harden-pearl-catcher-26-1-2'
          agent=''
          shopt -s nullglob
          for lease in tasks/$task/leases/*.json; do
            state=$(python -c 'import json,sys; print(json.load(open(sys.argv[1])).get("state", ""))' "$lease")
            [ "$state" = active ] || continue
            scope=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["scope"])' "$lease")
            owner=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["owner"])' "$lease")
            agent=${agent:-$owner}
            python agentctl.py release --task "$task" --scope "$scope" --agent "$owner" --reason 'Pearl Catcher 2.5.2 verified and PR #29 merged'
          done
          if [ -n "$agent" ]; then
            python agentctl.py task-state --task "$task" --agent "$agent" --state completed --message 'Pearl Catcher 2.5.2 hardening verified and merged via PR #29'
            python agentctl.py agent-state --agent "$agent" --state offline --reason 'Pearl Catcher hardening session completed'
          fi
          python agentctl.py validate
          if ! git diff --quiet; then
            git config user.name 'OpenAI Pearl Catcher Agent'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add tasks agents
            git commit -m 'chore: close Pearl Catcher hardening task'
            git push origin HEAD:main
          fi
