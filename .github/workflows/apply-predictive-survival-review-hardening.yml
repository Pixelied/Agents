name: Apply Predictive Survival review hardening

on:
  push:
    branches:
      - fix/predictive-survival-review-hardening
    paths:
      - '.psfix/**'
      - '.github/workflows/apply-predictive-survival-review-hardening.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and apply source patch
        shell: bash
        run: |
          set -euo pipefail
          cat .psfix/patch-* > /tmp/predictive-survival.patch.b64
          base64 -d /tmp/predictive-survival.patch.b64 > /tmp/predictive-survival.patch.gz
          echo '4440923f828921531421e46a19bfe6623c738a925572a745fb057e27b3b83af0  /tmp/predictive-survival.patch.gz' | sha256sum -c -
          gzip -dc /tmp/predictive-survival.patch.gz > /tmp/predictive-survival.patch
          echo 'c2a194d86077e989c10467f6008e5346ffe13fbf21bdd6ea58217121fa1339bd  /tmp/predictive-survival.patch' | sha256sum -c -
          git apply --check /tmp/predictive-survival.patch
          git apply /tmp/predictive-survival.patch
          rm -rf .psfix
          rm -f .github/workflows/apply-predictive-survival-review-hardening.yml
          git diff --check
          git status --short
      - name: Commit verified hardening patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Predictive Survival Hardening Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: harden Predictive Survival review invariants'
          git push origin HEAD:${GITHUB_REF_NAME}
