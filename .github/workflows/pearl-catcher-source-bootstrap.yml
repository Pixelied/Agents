name: Pearl Catcher source bootstrap

on:
  push:
    branches:
      - fix/pearl-catcher-26-1-2-hardening
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  materialize-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pearl-catcher-26-1-2-hardening
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Verify and materialize source package
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c <<'SUMS'
          6b44b36429bf41a1acd86382d919b23b593540fb00e7097ed7c440ddafad03f4  .bootstrap/pearl-catcher/package.part-00
          b4906fe36fb604bc117e6c0eded72d1952effdd3e3823cb3ca12eb479e79bf7b  .bootstrap/pearl-catcher/package.part-01
          6720e149a3f5f45db5c9678ad48e0e9cf3f3999f1191139ca69c71a6215f4e74  .bootstrap/pearl-catcher/package.part-02
          ac0404f8e7d5df37bd9a87afd3f1f2db4fa16b35d0f6cec33d2899f4adb46436  .bootstrap/pearl-catcher/package.part-03
          63cbda3c4773557552d26c90deee18e2781155866609ad8b884d215632a6e198  .bootstrap/pearl-catcher/package.part-04
          2326d4f00a51178ad48630a474bacc334c80380cc23d8477c67411db359abee9  .bootstrap/pearl-catcher/package.part-05
          2a836629c1d1504d0738be6d9b1b1109ce0992c2a4fa3a8bab420cf368363e50  .bootstrap/pearl-catcher/package.part-06
          1f3aa283054e5b7f186bc9cb859379774b6d3816a0448b0399864f16c8ad15cf  .bootstrap/pearl-catcher/package.part-07
          f0fbc72ee98f897573d863e037a7b7d95fe05b37fe0db1a40a3924046d3ee428  .bootstrap/pearl-catcher/package.part-08
          6542b83d26f68a97d9e781bfa0cc21ee1f32e5c441d9ec99fe4556563f15499c  .bootstrap/pearl-catcher/package.part-09
          0ea18dfc9a141d8b141e794f4841241c6de40c24161bb9366331ac0b6d52c975  .bootstrap/pearl-catcher/package.part-10
          a51513c68da8eddc3aa7243aed73a1f3524b46165fb0c1b454b8fbc231bc7e3f  .bootstrap/pearl-catcher/package.part-11
          fb5914cc30712385f87dc46dfcf4aca817f58e9048123cd51f0af9b0eba9c48a  .bootstrap/pearl-catcher/package.part-12
          58330a99809788d59edd7e46edc8816e9227d63f1c2d76d2eddb1aaf0643e457  .bootstrap/pearl-catcher/package.part-13
          SUMS
          cat .bootstrap/pearl-catcher/package.part-* | base64 -d > /tmp/pearl-catcher-source.tar.xz
          echo '9963052c268d3b37643b613d766c9e13d6670e61e319db68dbb99a718420b21a  /tmp/pearl-catcher-source.tar.xz' | sha256sum -c -
          rm -rf projects/pearl-catcher-26-1-2
          rm -f .github/workflows/pearl-catcher-26-1-2-ci.yml
          tar -xJf /tmp/pearl-catcher-source.tar.xz
          sha256sum -c .pearl-source-manifest.sha256

      - name: Source and core regressions
        shell: bash
        working-directory: projects/pearl-catcher-26-1-2
        run: |
          set -euo pipefail
          chmod +x scripts/*.sh
          ./scripts/run-core-tests.sh
          for script in scripts/test-*.sh; do
            case "$script" in
              scripts/test-event-class-abi.sh) continue ;;
            esac
            bash "$script"
          done

      - name: Fabric build
        working-directory: projects/pearl-catcher-26-1-2
        run: gradle clean build --stacktrace

      - name: Post-build ABI verification
        shell: bash
        working-directory: projects/pearl-catcher-26-1-2
        run: |
          set -euo pipefail
          JAR='build/libs/Pixelied-Studio-Pearl-Catcher-2.5.2.jar'
          test -f "$JAR"
          ./scripts/test-event-class-abi.sh "$JAR"
          rm -rf build/abi-classes
          mkdir -p build/abi-classes
          cp -R build/classes/java/main/. build/abi-classes/
          cp -R build/classes/java/client/. build/abi-classes/
          ./scripts/verify-manual-abi.sh build/abi-classes

      - name: Production jar audit
        shell: bash
        working-directory: projects/pearl-catcher-26-1-2
        run: |
          set -euo pipefail
          JAR='build/libs/Pixelied-Studio-Pearl-Catcher-2.5.2.jar'
          jar tf "$JAR" > build/production-jar.txt
          if grep -E '(^|/)(src|scripts|docs|test|tests|build)/|\.java$' build/production-jar.txt; then
            echo 'Unexpected source/test/debug content in production jar'
            exit 1
          fi
          grep -F 'studio/pixelied/pearlcatch/CatchCoordinator.class' build/production-jar.txt
          grep -F 'studio/pixelied/pearlcatch/core/GeneralCatchSolver.class' build/production-jar.txt

      - name: Workspace validation
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -v
          python agentctl.py validate

      - name: Commit verified clean source tree
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          rm -f .pearl-source-manifest.sha256
          rm -rf .bootstrap
          rm -f .github/workflows/pearl-catcher-source-bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo 'No source changes to commit'; exit 1; }
          git commit -m 'feat: harden Pearl Catcher 2.5.2'
          git push origin HEAD:fix/pearl-catcher-26-1-2-hardening
