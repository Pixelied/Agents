name: Predictive Survival Hardening Verify

on:
  push:
    branches:
      - ci/predictive-survival-hardening-verify

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout clean baseline plus verification transport
        uses: actions/checkout@v4

      - name: Reconstruct and apply saved hardening work
        shell: bash
        run: |
          set -euo pipefail
          cat ci/predictive-survival-hardening/recovery/part-*.b64 | tr -d '\n' | base64 -d > /tmp/predictive-survival-hardening.patch.gz
          echo 'fe582805d807b41e53c29e6875a2976ede61576a60a7a09f507029537fdcab7e  /tmp/predictive-survival-hardening.patch.gz' | sha256sum -c -
          gzip -t /tmp/predictive-survival-hardening.patch.gz
          git config user.name 'Predictive Survival CI'
          git config user.email 'predictive-survival-ci@example.invalid'
          gzip -dc /tmp/predictive-survival-hardening.patch.gz | git am --3way
          git status --short

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Clean test and build
        working-directory: projects/predictive-survival-26-1-2
        run: gradle --no-daemon --console=plain clean test build

      - name: Compile exact-runtime client GameTests
        working-directory: projects/predictive-survival-26-1-2
        run: gradle --no-daemon --console=plain compileGametestJava processGametestResources

      - name: Run exact Minecraft 26.1.2 client GameTests
        timeout-minutes: 8
        working-directory: projects/predictive-survival-26-1-2
        shell: bash
        run: |
          set +e
          xvfb-run -a gradle --no-daemon --console=plain runClientGameTest > gametest-console.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo '--- gametest-console.log tail ---'
            tail -n 180 gametest-console.log || true
            echo '--- run/logs/latest.log tail ---'
            tail -n 180 run/logs/latest.log || true
          fi
          exit "$status"

      - name: Verify production JAR isolation
        working-directory: projects/predictive-survival-26-1-2
        shell: bash
        run: |
          set -euo pipefail
          jar_file=$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' | head -n 1)
          test -n "$jar_file"
          if jar tf "$jar_file" | grep -q '^dev/pixelied/survival/validation/'; then
            echo 'GameTest validation classes leaked into production JAR'
            exit 1
          fi

      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: predictive-survival-hardening-verify-logs
          if-no-files-found: ignore
          path: |
            projects/predictive-survival-26-1-2/gametest-console.log
            projects/predictive-survival-26-1-2/run/logs/latest.log
