name: Temporary Predictive Survival burst apply

on:
  pull_request:
    branches:
      - project/predictive-survival-26-1-2
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply-test-commit:
    if: ${{ github.event.pull_request.head.ref == 'fix/predictive-survival-burst-guard-26-1-2' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/predictive-survival-burst-guard-26-1-2
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.5.1'
      - name: Apply reviewed production patch
        run: |
          test -f .burst-green.patch
          git apply --check .burst-green.patch
          git apply .burst-green.patch
          git rm .burst-green.patch
      - name: Verify full unit/build gate
        working-directory: projects/predictive-survival-26-1-2
        run: ./gradlew --no-daemon clean test build
      - name: Commit only after GREEN
        run: |
          git add projects/predictive-survival-26-1-2/src/client/java/dev/pixelied/survival/threat/ExplosionPredictor.java \
                  projects/predictive-survival-26-1-2/src/client/java/dev/pixelied/survival/threat/MeleePredictor.java
          git config user.name "Pixelied CI"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "fix: guard precursor crystal and approaching melee burst after RED"
          git push origin HEAD:fix/predictive-survival-burst-guard-26-1-2
