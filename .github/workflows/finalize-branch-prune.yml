name: Finalize physical branch prune

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: finalize-physical-branch-prune-2026-08-24
  cancel-in-progress: false

jobs:
  finalize:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.title == 'Finalize branch prune closeout'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Require untouched merge base
        env:
          EXPECTED_MAIN: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
      - name: Verify workspace before closeout
        run: |
          python -m unittest discover -s tests -v
          python agentctl.py validate
      - name: Apply coordination closeout and self-remove
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          agent_id = "openai-branch-prune-8e51"
          task_id = "prune-superseded-branches-2026-08-24"
          now = datetime.now(timezone.utc).isoformat()
          task_dir = Path("tasks") / task_id

          task_path = task_dir / "task.json"
          task = json.loads(task_path.read_text(encoding="utf-8"))
          task["status"] = "completed"
          task_path.write_text(json.dumps(task, indent=2) + "\n", encoding="utf-8")

          released = []
          for lease_path in sorted((task_dir / "leases").glob("*.json")):
              lease = json.loads(lease_path.read_text(encoding="utf-8"))
              if lease.get("owner") == agent_id and lease.get("state") == "active":
                  lease["state"] = "released"
                  lease["released_at"] = now
                  lease["release_reason"] = "Physical branch prune completed, recovery archive verified, temporary machinery removed, and final closeout verification started"
                  lease_path.write_text(json.dumps(lease, indent=2) + "\n", encoding="utf-8")
                  released.append(lease.get("scope"))

          profile_path = Path("agents") / agent_id / "profile.json"
          profile = json.loads(profile_path.read_text(encoding="utf-8"))
          profile["state"] = "offline"
          profile["state_updated_at"] = now
          profile["state_reason"] = "Physical branch prune completed; all cleanup scopes released"
          profile_path.write_text(json.dumps(profile, indent=2) + "\n", encoding="utf-8")

          event = {
              "schema_version": 1,
              "protocol_version": "1.0",
              "event_id": "8e51-physical-prune-completed-20260824",
              "task_id": task_id,
              "agent_id": agent_id,
              "type": "completed",
              "message": "Physically pruned 67 superseded branches, preserved all deleted heads in the recovery archive, removed destructive machinery, and closed coordination state.",
              "data": {
                  "branches_before": 87,
                  "branches_after": 20,
                  "deleted_branches": 67,
                  "archive_branch": "archive/pre-branch-prune-2026-08-24",
                  "archive_sha": "256ff367e2f5f2382dee4d6fa23c322005d5e4b4",
                  "prune_run_id": 32728525649,
                  "released_scopes": released,
              },
              "created_at": now,
          }
          event_path = task_dir / "events" / "20260824T125000.000000Z-8e51-physical-prune-completed.json"
          event_path.parent.mkdir(parents=True, exist_ok=True)
          event_path.write_text(json.dumps(event, indent=2) + "\n", encoding="utf-8")
          PY
          git rm .github/workflows/finalize-branch-prune.yml
          git config user.name "Pixelied"
          git config user.email "aemouzon@gmail.com"
          git add agents/openai-branch-prune-8e51/profile.json tasks/prune-superseded-branches-2026-08-24
          git commit -m "coord: close physical branch prune task"
          git push origin HEAD:main
      - name: Verify exact final main tree
        run: |
          git fetch origin main --depth=1
          git reset --hard origin/main
          test ! -e .github/workflows/finalize-branch-prune.yml
          test ! -e .github/workflows/prune-superseded-branches.yml
          test ! -e .github/workflows/prune-superseded-branches-locked.yml
          test ! -e tests/test_branch_prune_contract.py
          python -m unittest discover -s tests -v
          python agentctl.py validate
      - name: Delete verification branch and assert final branch topology
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          from urllib.error import HTTPError
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          token = os.environ["GITHUB_TOKEN"]
          repo = os.environ["REPOSITORY"]
          head_ref = os.environ["HEAD_REF"]
          head_sha = os.environ["HEAD_SHA"]
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "agents-final-prune-closeout",
          }

          def api(method, path, expected):
              request = Request(f"https://api.github.com{path}", method=method, headers=headers)
              try:
                  with urlopen(request, timeout=30) as response:
                      status = response.status
                      raw = response.read()
              except HTTPError as error:
                  status = error.code
                  raw = error.read()
              if status not in expected:
                  raise SystemExit(f"{method} {path} -> {status}: {raw.decode('utf-8', errors='replace')}")
              return status, json.loads(raw) if raw else None

          encoded = quote("heads/" + head_ref, safe="/")
          status, ref = api("GET", f"/repos/{repo}/git/ref/{encoded}", (200, 404))
          if status == 200:
              if ref["object"]["sha"] != head_sha:
                  raise SystemExit(f"verification branch moved: expected {head_sha}, got {ref['object']['sha']}")
              api("DELETE", f"/repos/{repo}/git/refs/{encoded}", (204,))
              api("GET", f"/repos/{repo}/git/ref/{encoded}", (404,))

          expected = {
              "archive/pre-branch-prune-2026-08-24",
              "backup/pre-project-split-2026-08-24",
              "ci/speedbridge-26-2-hook-inspect",
              "ci/speedbridge-breezily-milestone-1-5",
              "design/crystal-optimizer-v2",
              "design/speedbridge-breezily-silent-aim",
              "feat/crystal-optimizer-v2-lethal-efficiency",
              "feat/crystalbot-v3-world-class",
              "fix/crystal-optimizer-v2-kickstart",
              "fix/fallen-knight-playtest-v2",
              "fix/medusa-dungeon-rebuild",
              "legacy/mixed-main-2026-08-24",
              "main",
              "project/crystal-anchor-combat-optimizer-26-1-2",
              "project/fallen-knight-26-1-2",
              "project/hypershot",
              "project/medusa-26-1-2",
              "project/pearl-catcher-26-1-2",
              "project/predictive-survival-26-1-2",
              "project/spear-client-26-1-2",
          }
          page = 1
          actual = set()
          while True:
              _, items = api("GET", f"/repos/{repo}/branches?per_page=100&page={page}", (200,))
              actual.update(item["name"] for item in items)
              if len(items) < 100:
                  break
              page += 1
          if actual != expected:
              raise SystemExit(
                  "final branch topology mismatch: "
                  + json.dumps({"missing": sorted(expected - actual), "unexpected": sorted(actual - expected)})
              )
          print("final branch count:", len(actual))
          print("final branches:", json.dumps(sorted(actual), indent=2))
          PY
