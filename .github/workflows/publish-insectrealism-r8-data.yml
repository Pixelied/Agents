name: Publish InsectRealism R8.3 Empirical Bundle

on:
  push:
    branches:
      - insectrealism-r8-data
    paths:
      - '.github/workflows/publish-insectrealism-r8-data.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: insectrealism-r8.3-empirical-20260919
      PACKAGE_NAME: InsectRealism_R8_3_EMPIRICAL_COMPLETE
      R82_SHA256: a3ab0f268b201d8bc9c76465f386f3fa666dfad6bf8ccc3da1d9911353707457

    steps:
      - name: Check out R8.3 research branch
        uses: actions/checkout@v4
        with:
          ref: insectrealism-r8-data

      - name: Set up empirical-data tooling
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install acquisition/quality dependencies
        run: pip install requests==2.32.5 Pillow==11.3.0

      - name: Download and verify the audited R8.2 complete handoff
        shell: bash
        run: |
          set -euo pipefail
          R82="$RUNNER_TEMP/InsectRealism_R8_2_COMPLETE.zip"
          URL="https://github.com/Pixelied/Agents/releases/download/insectrealism-r8.2-complete-20260919/InsectRealism_R8_2_COMPLETE.zip"
          curl --fail --location --retry 5 "$URL" -o "$R82"
          ACTUAL="$(sha256sum "$R82" | awk '{print $1}')"
          test "$ACTUAL" = "$R82_SHA256"
          echo "$ACTUAL  InsectRealism_R8_2_COMPLETE.zip" > "$RUNNER_TEMP/R82_COMPONENT_SHA256.txt"

      - name: Expand R8.2 and create clean R8.3 layout
        shell: bash
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/r83-stage"
          ROOT="$RUNNER_TEMP/$PACKAGE_NAME"
          mkdir -p "$STAGE"
          unzip -q "$RUNNER_TEMP/InsectRealism_R8_2_COMPLETE.zip" -d "$STAGE"
          mv "$STAGE/InsectRealism_R8_2_COMPLETE" "$ROOT"

          mkdir -p "$ROOT/99_SUPERSEDED_R8_2"
          cp -a "$ROOT/00_START_HERE" "$ROOT/99_SUPERSEDED_R8_2/00_START_HERE_R8_2"
          cp -a "$ROOT/01_CURRENT_EVIDENCE" "$ROOT/99_SUPERSEDED_R8_2/01_CURRENT_EVIDENCE_R8_2"
          cp -a "$ROOT/03_ACQUISITION_TOOLING" "$ROOT/99_SUPERSEDED_R8_2/03_ACQUISITION_TOOLING_R8_2"
          cp -a "$ROOT/04_RELEASE_AUDIT" "$ROOT/99_SUPERSEDED_R8_2/04_RELEASE_AUDIT_R8_2"

          rm -rf "$ROOT/00_START_HERE" "$ROOT/01_CURRENT_EVIDENCE" "$ROOT/03_ACQUISITION_TOOLING" "$ROOT/04_RELEASE_AUDIT"
          mv "$ROOT/02_REFERENCE_DATA" "$ROOT/03_REFERENCE_MEDIA"

          mkdir -p             "$ROOT/00_START_HERE"             "$ROOT/01_CURRENT_GATES_AND_PROFILES"             "$ROOT/02_STUDY_DATA/PUBLISHED_DIRECT_NUMERIC"             "$ROOT/04_RELEASE_AUDIT"             "$ROOT/05_ACQUISITION_TOOLING"

          R83="research/insectrealism-r8-data/r8.3"
          cp "$R83/START_HERE_R8_3.md" "$ROOT/00_START_HERE/START_HERE.md"
          cp "$R83/ASTRA_READ_THIS_FIRST_R8_3.md" "$ROOT/00_START_HERE/ASTRA_READ_THIS_FIRST.md"
          cp "$R83/CURRENT_IMPLEMENTATION_PLAN_R8_3.md" "$ROOT/00_START_HERE/"
          cp "$R83/CURRENT_SPECIES_DECISION_R8_3.md" "$ROOT/00_START_HERE/"

          # Carry forward still-valid gates/profiles, but version-label the current copies as R8.3.
          cp "$ROOT/99_SUPERSEDED_R8_2/01_CURRENT_EVIDENCE_R8_2/CURRENT_REALISTIC_MODE_GATE_R8_2.md"              "$ROOT/01_CURRENT_GATES_AND_PROFILES/CURRENT_REALISTIC_MODE_GATE_R8_3.md"
          cp "$ROOT/99_SUPERSEDED_R8_2/01_CURRENT_EVIDENCE_R8_2/CURRENT_UNRESOLVED_GAPS_R8_2.md"              "$ROOT/01_CURRENT_GATES_AND_PROFILES/CURRENT_UNRESOLVED_GAPS_R8_3.md"
          cp "$ROOT/99_SUPERSEDED_R8_2/01_CURRENT_EVIDENCE_R8_2/CURRENT_QUALIFICATION_MATRIX_R8_2.csv"              "$ROOT/01_CURRENT_GATES_AND_PROFILES/CURRENT_QUALIFICATION_MATRIX_R8_3.csv"
          cp "$ROOT/99_SUPERSEDED_R8_2/01_CURRENT_EVIDENCE_R8_2/chelifer_cancroides_adult_optional_predator_r8_2.json"              "$ROOT/01_CURRENT_GATES_AND_PROFILES/chelifer_cancroides_adult_optional_predator_r8_3.json"

          sed -i 's/R8\.2/R8.3/g; s/R8_2/R8_3/g'              "$ROOT/01_CURRENT_GATES_AND_PROFILES/CURRENT_REALISTIC_MODE_GATE_R8_3.md"              "$ROOT/01_CURRENT_GATES_AND_PROFILES/CURRENT_UNRESOLVED_GAPS_R8_3.md"              "$ROOT/01_CURRENT_GATES_AND_PROFILES/CURRENT_QUALIFICATION_MATRIX_R8_3.csv"              "$ROOT/01_CURRENT_GATES_AND_PROFILES/chelifer_cancroides_adult_optional_predator_r8_3.json"

          cp "$R83/STUDY_DATA_SOURCES.json" "$ROOT/02_STUDY_DATA/"
          cp "$R83/PUBLISHED_DIRECT_NUMERIC/"* "$ROOT/02_STUDY_DATA/PUBLISHED_DIRECT_NUMERIC/"

          cp "$R83/acquire_study_data_r8_3.py" "$ROOT/05_ACQUISITION_TOOLING/"
          cp "$R83/rebalance_reference_media_r8_3.py" "$ROOT/05_ACQUISITION_TOOLING/"
          cp "$R83/validate_r8_3_package.py" "$ROOT/05_ACQUISITION_TOOLING/"
          cp "$RUNNER_TEMP/R82_COMPONENT_SHA256.txt" "$ROOT/04_RELEASE_AUDIT/"

          cat > "$ROOT/README.md" <<'EOF'
          # InsectRealism R8.3 — EMPIRICAL COMPLETE handoff

          Start with `00_START_HERE/START_HERE.md`.

          R8.3 fixes the R8.2 data imbalance:
          - roughly half of the best exact-species visual references are retained;
          - actual raw/open study files, source-data tables and reusable experimental recordings are added;
          - factual published movement/kinematic/model tables are bundled where reusable raw data were never released;
          - contextual biology datasets are separated from movement calibration;
          - copyrighted/reuse-unclear high-value movement material stays remote-only with provenance.

          The R8.3 implementation plan is the single implementation authority.

          The full existing Linepithema humile ant system remains in scope:
          worker morphology/size variation, callows, queens, males, eggs, larvae,
          pupae/brood, trails/pheromones, recruitment, colony context and realistic
          development/population timing.
          EOF

          cat > "$ROOT/99_SUPERSEDED_R8_2/README.md" <<'EOF'
          # Superseded R8.2 material

          Retained only for provenance. Do not use the R8.2 plan as current implementation
          authority. R8.3 edits the implementation plan directly and is the current authority.
          EOF

      - name: Quality-prune the R8.2 visual corpus to ~50 percent
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/$PACKAGE_NAME"
          python "$ROOT/05_ACQUISITION_TOOLING/rebalance_reference_media_r8_3.py"             --reference-root "$ROOT/03_REFERENCE_MEDIA"             --keep-ratio 0.50             --report-dir "$ROOT/04_RELEASE_AUDIT"             | tee "$ROOT/04_RELEASE_AUDIT/VISUAL_PRUNER_OUTPUT.json"

      - name: Acquire real raw/open study data and experimental recordings
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/$PACKAGE_NAME"
          python "$ROOT/05_ACQUISITION_TOOLING/acquire_study_data_r8_3.py"             --config "$ROOT/02_STUDY_DATA/STUDY_DATA_SOURCES.json"             --output "$ROOT/02_STUDY_DATA"             | tee "$ROOT/04_RELEASE_AUDIT/STUDY_ACQUISITION_OUTPUT.json"

          cat "$ROOT/02_STUDY_DATA/STUDY_DATA_SUMMARY.json"
          cat "$ROOT/02_STUDY_DATA/ACQUISITION_ERRORS_AND_BLOCKS.csv"

      - name: Run fail-closed R8.3 empirical validation
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/$PACKAGE_NAME"
          python -m py_compile             "$ROOT/05_ACQUISITION_TOOLING/acquire_study_data_r8_3.py"             "$ROOT/05_ACQUISITION_TOOLING/rebalance_reference_media_r8_3.py"             "$ROOT/05_ACQUISITION_TOOLING/validate_r8_3_package.py"
          python "$ROOT/05_ACQUISITION_TOOLING/validate_r8_3_package.py" "$ROOT"             | tee "$ROOT/04_RELEASE_AUDIT/FINAL_VALIDATOR_OUTPUT.json"

      - name: Add R8.3 package indexes and checksums
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/$PACKAGE_NAME"

          cat > "$ROOT/04_RELEASE_AUDIT/DATA_AUTHORITY_README.md" <<'EOF'
          # Data authority reminder

          File size is not evidence strength.

          - Raw target-stage data measuring the relevant parameter has highest runtime calibration value.
          - Published direct measurements/model parameters remain authoritative when authors did not release raw files.
          - Experimental recordings are restricted to their recorded stage/context.
          - Contextual physiology/molecular/life-history data cannot silently calibrate movement.
          - Curated reference images are renderer/material/pose evidence, not movement data.
          - Remote-only files are intentionally not redistributed when copyright/reuse is unclear.
          EOF

          find "$ROOT" -type f             ! -name FILE_INDEX.tsv             ! -name CONSOLIDATED_SHA256SUMS.txt             -printf '%P\t%s bytes\n' | sort             > "$ROOT/04_RELEASE_AUDIT/FILE_INDEX.tsv"

          find "$ROOT" -type f             ! -path "$ROOT/04_RELEASE_AUDIT/CONSOLIDATED_SHA256SUMS.txt"             -print0 | sort -z | xargs -0 sha256sum             | sed "s#  $ROOT/#  #"             > "$ROOT/04_RELEASE_AUDIT/CONSOLIDATED_SHA256SUMS.txt"

          du -sh "$ROOT"
          wc -l "$ROOT/04_RELEASE_AUDIT/FILE_INDEX.tsv"

      - name: Build one consolidated R8.3 ZIP
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          ZIP="$RUNNER_TEMP/$PACKAGE_NAME.zip"
          rm -f "$ZIP"
          zip -0 -q -r "$ZIP" "$PACKAGE_NAME"
          BYTES="$(stat -c%s "$ZIP")"
          test "$BYTES" -gt 100000000
          test "$BYTES" -lt 1800000000
          SHA="$(sha256sum "$ZIP" | awk '{print $1}')"
          echo "ZIP_BYTES=$BYTES" >> "$GITHUB_ENV"
          echo "ZIP_SHA256=$SHA" >> "$GITHUB_ENV"
          ls -lh "$ZIP"
          echo "$SHA  $PACKAGE_NAME.zip"

      - name: Publish one-asset R8.3 GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/$PACKAGE_NAME"
          ZIP="$RUNNER_TEMP/$PACKAGE_NAME.zip"
          NOTES="$RUNNER_TEMP/release-notes-r83.md"

          STUDY_FILES="$(jq -r '.files_acquired' "$ROOT/02_STUDY_DATA/STUDY_DATA_SUMMARY.json")"
          STUDY_BYTES="$(jq -r '.bytes_acquired' "$ROOT/02_STUDY_DATA/STUDY_DATA_SUMMARY.json")"
          VIS_BEFORE="$(jq -r '.files_before' "$ROOT/04_RELEASE_AUDIT/VISUAL_REBALANCE_SUMMARY.json")"
          VIS_AFTER="$(jq -r '.files_after' "$ROOT/04_RELEASE_AUDIT/VISUAL_REBALANCE_SUMMARY.json")"
          VIS_RATIO="$(jq -r '.actual_file_keep_ratio' "$ROOT/04_RELEASE_AUDIT/VISUAL_REBALANCE_SUMMARY.json")"

          cat > "$NOTES" <<'EOF'
          # InsectRealism R8.3 — EMPIRICAL research/data handoff

          **One download. One current implementation plan. Much less image-heavy.**

          R8.3 directly revises the implementation plan and research package. Astra/Codex
          should use `00_START_HERE/CURRENT_IMPLEMENTATION_PLAN_R8_3.md` as the single
          implementation authority.

          The existing Linepithema humile ant system remains fully in scope: worker
          morphology/size variation, callows, queens, males, eggs, larvae, pupae/brood,
          trail/pheromone behavior, recruitment and colony logic.

          R8.3 keeps roughly half of the best R8.2 visual/reference media and adds
          actual raw/open study data, source-data workbooks, experimental recordings,
          direct published movement/kinematic/model tables, and remote-only acquisition
          records for high-value copyrighted material.
          EOF

          {
            echo
            echo "Visual references: $VIS_BEFORE -> $VIS_AFTER files (retained ratio $VIS_RATIO)."
            echo "Reusable study/source files acquired: $STUDY_FILES files / $STUDY_BYTES bytes."
            echo "Final ZIP: $ZIP_BYTES bytes."
            echo "Final SHA-256: `$ZIP_SHA256`."
            echo
            echo "Build validation: PASS."
          } >> "$NOTES"

          if gh release view "$TAG" --repo Pixelied/Agents >/dev/null 2>&1; then
            gh api "repos/Pixelied/Agents/releases/tags/$TAG" --jq '.assets[].id'               | while read -r id; do
                  [ -n "$id" ] && gh api -X DELETE "repos/Pixelied/Agents/releases/assets/$id"
                done
            gh release upload "$TAG" "$ZIP" --repo Pixelied/Agents
            gh release edit "$TAG" --repo Pixelied/Agents               --title "InsectRealism R8.3 — Empirical Data + Curated References"               --notes-file "$NOTES"
          else
            gh release create "$TAG" "$ZIP"               --repo Pixelied/Agents               --target "$GITHUB_SHA"               --title "InsectRealism R8.3 — Empirical Data + Curated References"               --notes-file "$NOTES"
          fi

      - name: Verify final release asset
        shell: bash
        run: |
          set -euo pipefail
          JSON="$(gh api "repos/Pixelied/Agents/releases/tags/$TAG")"
          COUNT="$(jq '.assets | length' <<<"$JSON")"
          NAME="$(jq -r '.assets[0].name' <<<"$JSON")"
          SIZE="$(jq -r '.assets[0].size' <<<"$JSON")"
          DIGEST="$(jq -r '.assets[0].digest' <<<"$JSON")"
          URL="$(jq -r '.html_url' <<<"$JSON")"
          test "$COUNT" -eq 1
          test "$NAME" = "$PACKAGE_NAME.zip"
          test "$SIZE" -eq "$ZIP_BYTES"
          test "$DIGEST" = "sha256:$ZIP_SHA256"
          echo "Release: $URL"
          echo "Asset: $NAME"
          echo "Bytes: $SIZE"
          echo "Digest: $DIGEST"
