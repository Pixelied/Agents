name: Predictive Survival 26.1.2 Publish Final Source

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verification branch
        uses: actions/checkout@v4

      - name: Materialize checksum-pinned final audit patch
        shell: bash
        run: |
          set -euo pipefail
          cat ci/predictive-survival-hardening/final-fix/part-*.b64 | tr -d '\n' | base64 -d > /tmp/final-fix.patch.gz
          echo '5f6ccfbb314b7bbbab2768348c01d47d0ecc8cb51c2550decda66a299ce6fb6b  /tmp/final-fix.patch.gz' | sha256sum -c -
          gzip -t /tmp/final-fix.patch.gz
          gzip -dc /tmp/final-fix.patch.gz > /tmp/final-fix.patch
          echo 'b19ce2a1e966b17e5b465d228bbb572c0445ce14632ca7cc55f6b22e6a97d174  /tmp/final-fix.patch' | sha256sum -c -

      - name: Create exact clean final commit
        shell: bash
        run: |
          set -euo pipefail
          project='projects/predictive-survival-26-1-2'
          git fetch --no-tags origin main fix/predictive-survival-26-1-2-hardening
          test "$(git rev-parse origin/main)" = '4ee12ba909315030cb243bf1466a4d5684b60d0d'
          git checkout --detach b873688e33e7ff769767f931cfd49ba61e889d26
          test "$(git rev-parse HEAD)" = 'b873688e33e7ff769767f931cfd49ba61e889d26'

          git apply --check /tmp/final-fix.patch
          git apply --whitespace=nowarn /tmp/final-fix.patch
          git diff --check
          unexpected=$(git diff --name-only | grep -v '^projects/predictive-survival-26-1-2/' || true)
          test -z "$unexpected"

          ! grep -R -n --include='*.java' 'remotePlayer.getAttribute(Attributes.ATTACK_DAMAGE)' "$project/src/client/java"
          grep -q 'postStateUncertain' "$project/src/client/java/dev/pixelied/survival/timeline/ThreatTimelineSimulator.java"
          grep -q 'playerProperties(remotePlayer' "$project/src/client/java/dev/pixelied/survival/core/MinecraftWorldSnapshotFactory.java"

          git config user.name 'Predictive Survival CI'
          git config user.email 'predictive-survival-ci@example.invalid'
          git add "$project"
          git reset --soft origin/main
          git commit -m 'Harden Predictive Survival 26.1.2 survival prediction'

          git diff HEAD^..HEAD --check
          changed=$(git diff --name-only HEAD^..HEAD)
          printf '%s\n' "$changed"
          unexpected=$(printf '%s\n' "$changed" | grep -v '^projects/predictive-survival-26-1-2/' || true)
          test -z "$unexpected"
          status=$(git status --porcelain --untracked-files=all)
          if [ -n "$status" ]; then
            echo 'Unexpected post-commit working-tree state:'
            printf '%s\n' "$status"
            exit 1
          fi

          git push --force origin HEAD:refs/heads/tmp/predictive-survival-baked-latest
          echo "FINAL_SHA=$(git rev-parse HEAD)"
