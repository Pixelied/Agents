name: Predictive Survival 26.1.2 CI

on:
  push:
    branches:
      - main
      - feat/predictive-survival-26-1-2
    paths:
      - 'projects/predictive-survival-26-1-2/**'
      - '.github/workflows/predictive-survival-26-1-2-ci.yml'
  pull_request:
    paths:
      - 'projects/predictive-survival-26-1-2/**'
      - '.github/workflows/predictive-survival-26-1-2-ci.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Test and build
        working-directory: projects/predictive-survival-26-1-2
        run: gradle --no-daemon clean test build

      - name: Compile client GameTests
        working-directory: projects/predictive-survival-26-1-2
        run: gradle --no-daemon compileGametestJava processGametestResources

      - name: Run exact-runtime client GameTests
        working-directory: projects/predictive-survival-26-1-2
        shell: bash
        run: |
          set +e
          xvfb-run -a gradle --no-daemon --console=plain runClientGameTest > gametest-console.log 2>&1
          status=$?
          set -e
          exit "$status"

      - name: Print client GameTest diagnostics
        if: failure()
        working-directory: projects/predictive-survival-26-1-2
        shell: bash
        run: |
          echo '--- gametest-console.log tail ---'
          if [ -f gametest-console.log ]; then tail -n 120 gametest-console.log; else echo 'gametest-console.log not found'; fi
          echo '--- run/logs/latest.log tail ---'
          if [ -f run/logs/latest.log ]; then tail -n 120 run/logs/latest.log; else echo 'latest.log not found'; fi

      - name: Verify production jar isolation
        working-directory: projects/predictive-survival-26-1-2
        shell: bash
        run: |
          jar_file=$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' | head -n 1)
          if [ -z "$jar_file" ]; then
            echo 'production jar not found'
            exit 1
          fi
          if jar tf "$jar_file" | grep -q '^dev/pixelied/survival/validation/'; then
            echo 'GameTest validation classes leaked into production jar'
            exit 1
          fi

      - name: Upload production jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: predictive-survival-26.1.2
          if-no-files-found: error
          path: |
            projects/predictive-survival-26-1-2/build/libs/*.jar
            !projects/predictive-survival-26-1-2/build/libs/*-sources.jar
