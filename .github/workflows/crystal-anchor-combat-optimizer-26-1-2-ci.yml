name: Crystal Anchor Optimizer 26.1.2 CI

on:
  push:
    branches:
      - main
      - work/crystal-anchor-combat-optimizer-26-1-2
    paths:
      - 'projects/crystal-anchor-combat-optimizer-26-1-2/**'
      - '.github/workflows/crystal-anchor-combat-optimizer-26-1-2-ci.yml'
  pull_request:
    paths:
      - 'projects/crystal-anchor-combat-optimizer-26-1-2/**'
      - '.github/workflows/crystal-anchor-combat-optimizer-26-1-2-ci.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Test
        working-directory: projects/crystal-anchor-combat-optimizer-26-1-2
        run: gradle --no-daemon test
