name: Insect public source metadata
on:
  push:
    branches: [feat/insect-full-plan-20260917-7d6a]
    paths: [.github/workflows/insect-source-access-7d6a.yml]
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Read primary dataset metadata and calibration text
        run: |
          python - <<'PY'
          import json
          from urllib.request import Request,urlopen
          for url in ['https://api.figshare.com/v2/articles/9786260','https://api.github.com/repos/nobuaki-mzmt/diacamma-tandem/contents/data/trajectory/raw/body-length.txt']:
              try:
                  with urlopen(Request(url,headers={'User-Agent':'insect-research/0.2'}),timeout=30) as r:
                      data=json.load(r)
                  if 'figshare' in url:
                      data={k:data.get(k) for k in ['id','title','doi','version','license','files','description','references','published_date']}
                  else:
                      data={k:data.get(k) for k in ['path','size','sha','encoding','content']}
                  print('METADATA',json.dumps(data,sort_keys=True))
              except Exception as exc:
                  print('ACCESS_FAILURE',url,type(exc).__name__,str(exc))
          PY
