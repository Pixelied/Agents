name: Insect public source metadata
on:
  push:
    branches: [feat/insect-full-plan-20260917-7d6a]
    paths: [.github/workflows/insect-source-access-7d6a.yml]
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Inspect ZIP central directory through bounded public range reads
        run: |
          python - <<'PY'
          import io,json,pathlib,struct,zipfile
          from urllib.request import Request,urlopen
          url='https://ndownloader.figshare.com/files/22588088'
          size=1227522364
          def read_range(start,end):
              with urlopen(Request(url,headers={'Range':f'bytes={start}-{end}','Accept-Encoding':'identity'}),timeout=60) as r:
                  if r.status!=206: raise ValueError('Server did not honor bounded Range request')
                  data=r.read(end-start+2)
                  if len(data)!=end-start+1: raise ValueError('Incorrect range length')
                  if r.headers.get('Content-Range')!=f'bytes {start}-{end}/{size}': raise ValueError('Incorrect Content-Range')
                  return data
          tail=read_range(size-65557,size-1)
          at=tail.rfind(b'PK\x05\x06')
          if at<0: raise ValueError('ZIP end record missing')
          fields=struct.unpack('<4s4H2LH',tail[at:at+22])
          cd_size,cd_offset=fields[5:7]
          assert cd_size<5000000 and cd_offset+cd_size<=size
          directory=read_range(cd_offset,cd_offset+cd_size-1)
          path=pathlib.Path('archive-directory.sparse')
          with path.open('wb') as f:
              f.truncate(size);f.seek(size-len(tail));f.write(tail);f.seek(cd_offset);f.write(directory)
          with zipfile.ZipFile(path) as z:
              print('MEMBER_COUNT',len(z.infolist()))
              for info in z.infolist()[:150]:
                  print('MEMBER',json.dumps({'name':info.filename,'bytes':info.file_size,'compressed':info.compress_size,'offset':info.header_offset,'method':info.compress_type}))
          PY
