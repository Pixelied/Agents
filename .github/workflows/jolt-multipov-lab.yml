name: Jolt Multi-POV Lab tests
on:
  push:
    branches:
      - project/jolt-multipov-lab
    paths:
      - 'projects/jolt-multipov-lab/**'
      - '.github/workflows/jolt-multipov-lab.yml'
  pull_request:
    paths:
      - 'projects/jolt-multipov-lab/**'
      - '.github/workflows/jolt-multipov-lab.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test analysis and browser interactions
        working-directory: projects/jolt-multipov-lab
        run: node --test tests/*.test.js
