name: Insect release license audit
on:
  push:
    branches: [feat/insect-release-20260918-r4d8]
    paths: [.github/workflows/insect-release.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  license-texts:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve omitted notices from exact crate revisions
        run: python3 projects/insect-realism-desktop-app/scripts/license_fetch.py --requests projects/insect-realism-desktop-app/scripts/license-requests.json --output license-texts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: insect-upstream-license-texts
          path: license-texts/
          retention-days: 30
          if-no-files-found: error
