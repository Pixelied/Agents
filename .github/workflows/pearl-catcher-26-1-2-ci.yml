name: Pearl Catcher 26.1.2 CI

on:
  pull_request:
    paths:
      - 'projects/pearl-catcher-26-1-2/**'
      - '.github/workflows/pearl-catcher-26-1-2-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'projects/pearl-catcher-26-1-2/**'
      - '.github/workflows/pearl-catcher-26-1-2-ci.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Run source regressions
        working-directory: projects/pearl-catcher-26-1-2
        run: |
          ./scripts/run-core-tests.sh
          for script in scripts/test-*.sh; do
            case "$(basename "$script")" in
              test-event-class-abi.sh|verify-manual-abi.sh) continue ;;
            esac
            bash "$script"
          done

      - name: Build production JAR
        working-directory: projects/pearl-catcher-26-1-2
        run: gradle clean build --stacktrace

      - name: Verify built ABI
        working-directory: projects/pearl-catcher-26-1-2
        run: |
          JAR="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' ! -name '*dev*' | head -n 1)"
          test -n "$JAR"
          echo "Auditing $JAR"
          bash scripts/test-event-class-abi.sh "$JAR"
          rm -rf build/abi-classes
          mkdir -p build/abi-classes
          cp -R build/classes/java/main/. build/abi-classes/
          cp -R build/classes/java/client/. build/abi-classes/
          bash scripts/verify-manual-abi.sh build/abi-classes

      - name: Audit production artifact
        working-directory: projects/pearl-catcher-26-1-2
        run: |
          JAR="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' ! -name '*dev*' | head -n 1)"
          test -n "$JAR"
          jar tf "$JAR" > /tmp/pearl-jar-contents.txt
          ! grep -E '(^|/)(build/|\.gradle/|\.git/|docs/|scripts/)|\.java$|\.class\.tmp$' /tmp/pearl-jar-contents.txt
          grep -q 'studio/pixelied/pearlcatch/PearlCatchClient.class' /tmp/pearl-jar-contents.txt
          grep -q 'studio/pixelied/pearlcatch/CatchCoordinator.class' /tmp/pearl-jar-contents.txt
          grep -q 'studio/pixelied/pearlcatch/core/GeneralCatchSolver.class' /tmp/pearl-jar-contents.txt
          grep -q 'fabric.mod.json' /tmp/pearl-jar-contents.txt

      - name: Run workspace tests
        working-directory: .
        run: python -m unittest discover -s tests -v

      - name: Validate workspace
        working-directory: .
        run: python agentctl.py validate

      - name: Upload production JAR
        uses: actions/upload-artifact@v4
        with:
          name: pearl-catcher-2.5.2
          path: projects/pearl-catcher-26-1-2/build/libs/*.jar
          if-no-files-found: error
