name: Bootstrap Predictive Survival Gradle Wrapper

on:
  push:
    branches:
      - fix/predictive-survival-review-hardening
    paths:
      - '.github/workflows/predictive-survival-wrapper-bootstrap.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: fix/predictive-survival-review-hardening

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Provision Gradle 9.5.1 for bootstrap only
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.5.1'
          validate-wrappers: false

      - name: Regenerate and commit exact wrapper
        shell: bash
        run: |
          set -euo pipefail
          project='projects/predictive-survival-26-1-2'
          cd "$project"
          rm -f gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
          gradle --no-daemon wrapper --gradle-version 9.5.1 --distribution-type bin
          python3 - <<'PY'
          from pathlib import Path
          path = Path('gradle/wrapper/gradle-wrapper.properties')
          text = path.read_text()
          marker = 'distributionUrl=https\\://services.gradle.org/distributions/gradle-9.5.1-bin.zip\n'
          checksum = 'distributionSha256Sum=bafc141b619ad6350fd975fc903156dd5c151998cc8b058e8c1044ab5f7b031f\n'
          if checksum not in text:
              if marker not in text:
                  raise SystemExit('expected Gradle 9.5.1 distribution URL missing')
              text = text.replace(marker, marker + checksum)
              path.write_text(text)
          PY
          cd ../..
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$project/gradlew" "$project/gradlew.bat" "$project/gradle/wrapper/gradle-wrapper.jar" "$project/gradle/wrapper/gradle-wrapper.properties"
          if git diff --cached --quiet; then
            echo 'Wrapper already exact; nothing to commit.'
            exit 0
          fi
          git commit -m 'build: regenerate pinned Gradle wrapper'
          git push origin HEAD:fix/predictive-survival-review-hardening
