name: Temporary Predictive Survival burst GREEN 2

on:
  pull_request:
    branches:
      - project/predictive-survival-26-1-2
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply-test-commit:
    if: ${{ github.event.pull_request.number == 40 && github.event.pull_request.head.ref == 'fix/predictive-survival-burst-guard-26-1-2' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/predictive-survival-burst-guard-26-1-2
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.5.1'
      - name: Apply exact reviewed GREEN edits
        run: |
          test -f .burst-green2.patch
          git rm .burst-green2.patch
          if [ -f .burst-green2-trigger ]; then git rm .burst-green2-trigger; fi
          python3 - <<'PY'
          from pathlib import Path

          p = Path('projects/predictive-survival-26-1-2/src/client/java/dev/pixelied/survival/core/MinecraftMeleeSnapshotAdapter.java')
          s = p.read_text()
          old = '''        ItemStack weapon = player.getMainHandItem();
        Map<String, String> properties = new LinkedHashMap<>();
'''
          new = '''        ItemStack weapon = player.getMainHandItem();
        ItemStack offhand = player.getOffhandItem();
        Map<String, String> properties = new LinkedHashMap<>();
'''
          if old not in s: raise SystemExit('remote player hand capture anchor changed')
          s = s.replace(old, new, 1)
          old = '''        AttributeInstance range = player.getAttribute(Attributes.ENTITY_INTERACTION_RANGE);
        if (range != null) properties.put("attack_range", Double.toString(range.getValue()));
        properties.put("weapon_key", itemKey(weapon));
'''
          new = '''        AttributeInstance range = player.getAttribute(Attributes.ENTITY_INTERACTION_RANGE);
        if (range != null) properties.put("attack_range", Double.toString(range.getValue()));
        AttributeInstance blockRange = player.getAttribute(Attributes.BLOCK_INTERACTION_RANGE);
        if (blockRange != null) properties.put("block_interaction_range", Double.toString(blockRange.getValue()));
        properties.put("weapon_key", itemKey(weapon));
        properties.put("offhand_item_key", itemKey(offhand));
'''
          if old not in s: raise SystemExit('remote player range/item capture anchor changed')
          p.write_text(s.replace(old, new, 1))

          p = Path('projects/predictive-survival-26-1-2/src/client/java/dev/pixelied/survival/threat/ExplosionPredictor.java')
          s = p.read_text()
          old = '''        DamageRange raw = triggerable
            ? triggerableDamageEnvelope(radius, center, sourceVelocity, impact.latest(), context, world)
            : damageAt(radius, center, context.player().position(), context.player().boundingBox(), world);
'''
          new = '''        boolean fusedMotionEnvelope = !triggerable
            && impact.latest() > 0L
            && (hasMotion(sourceVelocity) || hasMotion(context.player().velocity()));
        if (fusedMotionEnvelope) confidence = lessCertain(confidence, Confidence.BOUNDED);

        DamageRange raw = triggerable || fusedMotionEnvelope
            ? triggerableDamageEnvelope(radius, center, sourceVelocity, impact.latest(), context, world)
            : damageAt(radius, center, context.player().position(), context.player().boundingBox(), world);
'''
          if old not in s: raise SystemExit('fused explosion damage anchor changed')
          s = s.replace(old, new, 1)
          anchor = '''    private static double parseFiniteNonNegative(String value, double fallback) {
'''
          helper = '''    private static boolean hasMotion(Vec3Snapshot velocity) {
        return velocity.x() != 0d || velocity.y() != 0d || velocity.z() != 0d;
    }

    private static double parseFiniteNonNegative(String value, double fallback) {
'''
          if anchor not in s: raise SystemExit('ExplosionPredictor motion helper anchor changed')
          p.write_text(s.replace(anchor, helper, 1))
          PY
      - name: Verify full unit/build gate
        working-directory: projects/predictive-survival-26-1-2
        run: ./gradlew --no-daemon clean test build
      - name: Commit only after GREEN
        run: |
          git add projects/predictive-survival-26-1-2/src/client/java/dev/pixelied/survival/threat/ExplosionPredictor.java \
                  projects/predictive-survival-26-1-2/src/client/java/dev/pixelied/survival/core/MinecraftMeleeSnapshotAdapter.java
          git config user.name "Pixelied CI"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "fix: bound moving fused explosions and capture remote burst items"
          git push origin HEAD:fix/predictive-survival-burst-guard-26-1-2
