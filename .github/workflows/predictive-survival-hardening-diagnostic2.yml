name: Predictive Survival Hardening Diagnostic 2

on:
  push:
    branches:
      - ci/predictive-survival-hardening-recovery-check
    paths-ignore:
      - '.ci/predictive-survival-hardening/latest-diagnostic2.log'

permissions:
  contents: write

jobs:
  compile-gametest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply current local runtime-test fix in diagnostic workspace
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            projects/predictive-survival-26-1-2/src/gametest/java/dev/pixelied/survival/validation/WitherSkeletonMeleeValidationScenarios.java \
            projects/predictive-survival-26-1-2/src/gametest/java/dev/pixelied/survival/validation/TriggerableExplosionProtectionValidationScenarios.java
          do
            sed -i 's/ClientGameTestContext\.DEFAULT_TIMEOUT/200/g' "$file"
          done
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Compile client GameTests and capture exact diagnostics
        id: compile
        working-directory: projects/predictive-survival-26-1-2
        shell: bash
        run: |
          set +e
          gradle --no-daemon --console=plain compileGametestJava > /tmp/ps-gametest-compile2.log 2>&1
          status=$?
          cat /tmp/ps-gametest-compile2.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Commit compiler diagnostics on failure
        if: steps.compile.outputs.status != '0'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci/predictive-survival-hardening
          cp /tmp/ps-gametest-compile2.log .ci/predictive-survival-hardening/latest-diagnostic2.log
          git checkout -- projects/predictive-survival-26-1-2/src/gametest/java/dev/pixelied/survival/validation/WitherSkeletonMeleeValidationScenarios.java projects/predictive-survival-26-1-2/src/gametest/java/dev/pixelied/survival/validation/TriggerableExplosionProtectionValidationScenarios.java || true
          git config user.name 'Predictive Survival Diagnostic CI'
          git config user.email 'actions@users.noreply.github.com'
          git add .ci/predictive-survival-hardening/latest-diagnostic2.log
          git commit -m 'ci: capture Predictive Survival GameTest compiler diagnostics 2 [skip ci]' || exit 0
          git push origin HEAD:ci/predictive-survival-hardening-recovery-check
      - name: Fail after diagnostics are persisted
        if: steps.compile.outputs.status != '0'
        run: exit 1
