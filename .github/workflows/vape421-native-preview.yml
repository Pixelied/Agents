name: Minecraft 26.2 interactive native Vulkan preview
on:
  push:
    branches: [feat/vape421-native-preview-b61c]
    paths:
      - 'projects/vape421-fabric-clean-build/runtime-verification/preview/**'
      - 'projects/vape421-fabric-clean-build/runtime-verification/launch_preview.py'
      - '.github/workflows/vape421-native-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-render:
    strategy:
      fail-fast: false
      matrix:
        backend: [vulkan]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Run official 26.2 demo and validate actual native GUI pixels
        env:
          PROBE_BACKEND: ${{ matrix.backend }}
        shell: bash
        run: |
          command -v Xvfb
          if [ "$PROBE_BACKEND" = vulkan ]; then
            icd=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit 2>/dev/null || true)
            if [ -z "$icd" ]; then sudo apt-get update -qq && sudo apt-get install -y mesa-vulkan-drivers libvulkan1 vulkan-tools; fi
            icd=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit 2>/dev/null || true)
            test -n "$icd"
            export VK_ICD_FILENAMES="$icd"
            echo "Using software Vulkan ICD: $icd"
            if command -v vulkaninfo >/dev/null; then vulkaninfo --summary || true; fi
          fi
          Xvfb :99 -screen 0 1280x720x24 -ac >/tmp/native-probe-xvfb.log 2>&1 &
          export DISPLAY=:99
          sleep 2
          python -u projects/vape421-fabric-clean-build/runtime-verification/launch_preview.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-preview-${{ matrix.backend }}
          path: smoke-results/
          if-no-files-found: warn
          retention-days: 7
