name: Insect desktop graphics bootstrap
on:
  push:
    branches: [feat/insect-desktop-20260917-d41e]
    paths: [.github/workflows/insect-desktop.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  graphics-dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Resolve audited upstream graphics versions
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
          mkdir -p "$RUNNER_TEMP/fetch/src" "$RUNNER_TEMP/export"
          cat > "$RUNNER_TEMP/fetch/Cargo.toml" <<'EOF'
          [package]
          name = "insect-graphics-dependencies"
          version = "0.1.0"
          edition = "2024"
          [dependencies]
          wgpu = "=30.0.1"
          egui = "=0.36.2"
          egui-wgpu = "=0.36.2"
          egui-winit = { version = "=0.36.2", default-features = false, features = ["clipboard", "links", "x11"] }
          winit = { version = "=0.30.13", default-features = false, features = ["rwh_06", "x11"] }
          bytemuck = { version = "=1.25.0", features = ["derive"] }
          naga = { version = "30", features = ["wgsl-in"] }
          [target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
          tray-icon = "=0.20.1"
          global-hotkey = "=0.7.0"
          [target.'cfg(target_os = "macos")'.dependencies]
          objc2 = "=0.6.4"
          objc2-app-kit = "=0.3.2"
          objc2-foundation = "=0.3.2"
          block2 = "0.6"
          [target.'cfg(target_os = "windows")'.dependencies]
          windows = { version = "=0.61.3", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_Registry", "Win32_System_Power", "Win32_System_SystemInformation"] }
          EOF
          printf 'fn main() {}\n' > "$RUNNER_TEMP/fetch/src/main.rs"
          cargo fetch --manifest-path "$RUNNER_TEMP/fetch/Cargo.toml"
          cargo vendor --manifest-path "$RUNNER_TEMP/fetch/Cargo.toml" --versioned-dirs "$RUNNER_TEMP/export/vendor" > "$RUNNER_TEMP/export/vendor-config.toml"
          cp "$RUNNER_TEMP/fetch/Cargo.lock" "$RUNNER_TEMP/export/graphics.lock"
          grep -n -A 7 'composite_alpha_modes\|DxgiFromVisual' "$RUNNER_TEMP/export/vendor"/wgpu-hal-30*/src/dx12/adapter.rs > "$RUNNER_TEMP/export/transparency-capabilities.txt"
          tar -C "$RUNNER_TEMP/export" -czf "$RUNNER_TEMP/insect-graphics-dependencies.tar.gz" .
          sha256sum "$RUNNER_TEMP/insect-graphics-dependencies.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: insect-graphics-dependencies
          path: ${{ runner.temp }}/insect-graphics-dependencies.tar.gz
          retention-days: 2
          compression-level: 0
