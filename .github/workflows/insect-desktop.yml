name: Insect desktop bootstrap
on:
  push:
    branches: [feat/insect-desktop-20260917-d41e]
    paths: [.github/workflows/insect-desktop.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify coordination baseline
        run: |
          python -m unittest discover -s tests -v
          python agentctl.py validate
      - name: Prepare minimal toolchain and dependency cache
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-pc-windows-msvc x86_64-pc-windows-gnu
          mkdir -p "$RUNNER_TEMP/fetch/src" "$RUNNER_TEMP/export"
          cat > "$RUNNER_TEMP/fetch/Cargo.toml" <<'EOF'
          [package]
          name = "insect-dependency-cache"
          version = "0.1.0"
          edition = "2024"
          [dependencies]
          serde = { version = "=1.0.228", features = ["derive"] }
          serde_json = "=1.0.145"
          toml = "=0.8.23"
          thiserror = "=2.0.16"
          glam = { version = "=0.29.3", features = ["serde", "bytemuck"] }
          rand_chacha = "=0.3.1"
          rand_core = "=0.6.4"
          bytemuck = { version = "=1.23.2", features = ["derive"] }
          wgpu = "=24.0.5"
          winit = { version = "=0.30.12", default-features = false, features = ["rwh_06", "x11"] }
          egui = "=0.31.1"
          egui-wgpu = "=0.31.1"
          egui-winit = { version = "=0.31.1", default-features = false, features = ["clipboard", "links", "x11"] }
          tracing = "=0.1.41"
          tracing-subscriber = { version = "=0.3.20", features = ["env-filter"] }
          postcard = { version = "=1.1.3", features = ["alloc", "use-std"] }
          directories = "=6.0.0"
          proptest = "=1.7.0"
          criterion = "=0.5.1"
          image = { version = "=0.25.6", default-features = false, features = ["png"] }
          pollster = "=0.4.0"
          raw-window-handle = "=0.6.2"
          clap = { version = "=4.5.48", features = ["derive"] }
          sha2 = "=0.10.9"
          tempfile = "=3.20.0"
          csv = "=1.3.1"
          naga = { version = "=24.0.0", features = ["wgsl-in"] }
          [target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
          tray-icon = "=0.20.1"
          global-hotkey = "=0.7.0"
          [target.'cfg(target_os = "macos")'.dependencies]
          objc2 = "=0.6.2"
          objc2-app-kit = "=0.3.1"
          objc2-foundation = "=0.3.1"
          block2 = "=0.6.1"
          [target.'cfg(target_os = "windows")'.dependencies]
          windows = { version = "=0.61.3", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_Registry", "Win32_System_Power", "Win32_System_SystemInformation"] }
          EOF
          echo 'fn main() {}' > "$RUNNER_TEMP/fetch/src/main.rs"
          cargo fetch --manifest-path "$RUNNER_TEMP/fetch/Cargo.toml"
          cargo vendor --manifest-path "$RUNNER_TEMP/fetch/Cargo.toml" --versioned-dirs "$RUNNER_TEMP/export/vendor" > "$RUNNER_TEMP/export/vendor-config.toml"
          cp "$RUNNER_TEMP/fetch/Cargo.lock" "$RUNNER_TEMP/export/dependency-cache.lock"
          tc="$(rustc --print sysroot)"
          mkdir -p "$RUNNER_TEMP/export/toolchain" "$RUNNER_TEMP/export/repository"
          cp -a "$tc/bin" "$tc/lib" "$RUNNER_TEMP/export/toolchain/"
          cp -a . "$RUNNER_TEMP/export/repository/"
          rustc --version --verbose | tee "$RUNNER_TEMP/export/toolchain-version.txt"
          tar -C "$RUNNER_TEMP/export" -czf "$RUNNER_TEMP/insect-offline-environment.tar.gz" .
          sha256sum "$RUNNER_TEMP/insect-offline-environment.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: insect-offline-environment
          path: ${{ runner.temp }}/insect-offline-environment.tar.gz
          retention-days: 2
          compression-level: 0
