name: Insect native continuation - pinned source preparation
"on":
  push:
    branches: ['feat/insect-native-verified-20260918-a6d2']
    paths:
      - '.github/workflows/insect-native-ci.yml'
      - 'projects/insect-realism-native-n8e6/BUILD_READY.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: insect-native-a6d2-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-data:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: .cache/insect-pinned-source
          key: insect-rdata-6771911286c806a675a171a21e64a52798ba4e902083e61d2aa66ea3fe0c8cbf
      - name: Acquire only the pinned original research payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/insect-pinned-source
          if [ ! -f .cache/insect-pinned-source/temnothorax.RData ]; then
            curl --fail --location --retry 3 --connect-timeout 30 --max-time 900 \
              https://ndownloader.figshare.com/files/22588088 \
              --output "$RUNNER_TEMP/insect-original-data.zip"
            printf '%s  %s\n' f76d029dbd4cd2ed12d89ee62b755071340f722e6f804ae173f3cc0ca944e5f4 "$RUNNER_TEMP/insect-original-data.zip" | sha256sum --check
            python - <<'PY'
          from pathlib import Path
          import os, zipfile
          source = Path(os.environ['RUNNER_TEMP']) / 'insect-original-data.zip'
          with zipfile.ZipFile(source) as archive:
              info = archive.getinfo('figshare/data/temnothorax.RData')
              if info.file_size != 7145834:
                  raise SystemExit('Unexpected original RData size; refusing extraction')
              data = archive.read(info)
          Path('.cache/insect-pinned-source/temnothorax.RData').write_bytes(data)
          source.unlink()
          PY
          fi
          printf '%s  %s\n' 6771911286c806a675a171a21e64a52798ba4e902083e61d2aa66ea3fe0c8cbf .cache/insect-pinned-source/temnothorax.RData | sha256sum --check
      - name: Convert original coordinates without executing research R code
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check numpy==1.26.4 pandas==2.2.3 pyreadr==0.5.6
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, pandas, pyreadr
          root = Path('.cache/insect-pinned-source')
          objects = pyreadr.read_r(str(root / 'temnothorax.RData'))
          frame = objects['df']
          output = root / 'temnothorax-source-coordinates.csv'
          frame.to_csv(output, index=False, float_format='%.17g', lineterminator='\n')
          actual = hashlib.sha256(output.read_bytes()).hexdigest()
          report = {
              'source': 'Valentini et al. (2020), DOI 10.6084/m9.figshare.9786260.v1',
              'license': 'CC BY 4.0', 'r_source_executed': False,
              'pyreadr_version': pyreadr.__version__, 'pandas_version': pandas.__version__,
              'rows': len(frame), 'columns': list(frame.columns),
              'coordinate_sha256': actual, 'application_build_verified': False,
          }
          (root / 'source-data-report.json').write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps(report, indent=2))
          if actual != '810c67bfcc2c078a01c3af8657d688c804027eb661c2b614a6a74c4b0d92da31':
              raise SystemExit('Coordinate conversion differs from the verified continuation; no substitute data accepted')
          PY
      - name: Preserve authenticated source input and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: insect-pinned-source-a6d2
          path: .cache/insect-pinned-source/
          retention-days: 30
          if-no-files-found: error
      - name: Record the limited scope of this preparation stage
        if: success()
        shell: bash
        run: |
          printf '%s\n' '## Original source authenticated' 'The original RData and coordinate CSV match the supplied continuation exactly.' 'This source-preparation stage is not an application build, installer, or native input-safety qualification.' >> "$GITHUB_STEP_SUMMARY"
