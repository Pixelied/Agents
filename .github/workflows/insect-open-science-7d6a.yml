name: Insect open science review sources
on:
  push:
    branches: [feat/insect-full-plan-20260917-7d6a]
    paths: [.github/workflows/insect-open-science-7d6a.yml]
permissions:
  contents: read
jobs:
  retrieve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Retrieve open-access JATS; corroborate previously reviewed item permissions
        run: |
          python - <<'PY'
          import hashlib,json,pathlib,time,xml.etree.ElementTree as ET
          from urllib.request import Request,urlopen
          # These individual publisher/PMC pages were reviewed for CC permission.
          # All-rights-reserved PMC6030638 is deliberately NOT on this list.
          sources={
            'PMC7137955':'https://pmc.ncbi.nlm.nih.gov/articles/PMC7137955/',
            'PMC3400603':'https://journals.plos.org/ploscompbiol/article?id=10.1371/journal.pcbi.1002592',
            'PMC4641605':'https://journals.plos.org/plosone/article?id=10.1371/journal.pone.0141269',
            'PMC7392607':'https://elifesciences.org/articles/55395',
            'PMC7676868':'https://elifesciences.org/articles/58145',
            'PMC6805160':'https://elifesciences.org/articles/48945'
          }
          root=pathlib.Path('open-science-evidence');root.mkdir()
          failures=[]
          for pmcid,evidence in sources.items():
              folder=root/pmcid;folder.mkdir()
              url='https://www.ebi.ac.uk/europepmc/webservices/rest/'+pmcid+'/fullTextXML'
              try:
                  with urlopen(Request(url,headers={'User-Agent':'insect-realism-research/0.2','Accept':'application/xml'}),timeout=45) as r:
                      xml=r.read(6000001)
                  if len(xml)>6000000: raise ValueError('Source exceeds bounded retrieval size')
                  tree=ET.fromstring(xml)
                  permissions=tree.find('.//article-meta/permissions')
                  permission_text=' '.join(permissions.itertext()) if permissions is not None else ''
                  permission_xml=ET.tostring(permissions,encoding='unicode') if permissions is not None else ''
                  if 'creativecommons.org' not in permission_xml and 'Creative Commons' not in permission_text:
                      raise ValueError('Full-text permissions did not corroborate prior publisher CC permission')
                  def text(node): return ' '.join(' '.join(node.itertext()).split())
                  blocks=[]
                  abstract=tree.find('.//article-meta/abstract')
                  if abstract is not None: blocks.append({'label':'Abstract','text':text(abstract)})
                  body=tree.find('body')
                  if body is None: raise ValueError('Article body unavailable')
                  for i,node in enumerate(list(body)):
                      label=text(node.find('title')) if node.find('title') is not None else node.tag+'-'+str(i)
                      blocks.append({'label':label,'text':text(node)})
                  article_ids={x.attrib.get('pub-id-type'):text(x) for x in tree.findall('.//article-meta/article-id')}
                  title=text(tree.find('.//article-title'))
                  (folder/'article.xml').write_bytes(xml)
                  (folder/'review_blocks.json').write_text(json.dumps(blocks,indent=2,ensure_ascii=False)+'\n')
                  (folder/'metadata.json').write_text(json.dumps(dict(pmcid=pmcid,title=title,article_ids=article_ids,permissions=permission_text,permissions_xml=permission_xml,license_evidence_url=evidence,retrieval_url=url,xml_sha256=hashlib.sha256(xml).hexdigest(),retrieved_on='2026-09-17',review_status='retrieved-not-reviewed',body_word_count=sum(len(b['text'].split()) for b in blocks)),indent=2,ensure_ascii=False)+'\n')
                  print('RETRIEVED_NOT_REVIEWED',pmcid,article_ids.get('doi'),len(xml),sum(len(b['text'].split()) for b in blocks))
              except Exception as exc:
                  failures.append(pmcid)
                  (folder/'ACCESS_FAILURE.txt').write_text(type(exc).__name__+': '+str(exc)+'\n')
                  print('ACCESS_FAILURE',pmcid,type(exc).__name__,str(exc))
              time.sleep(.4)
          print('SUMMARY',len(sources)-len(failures),'retrieved;',len(failures),'failed; none automatically reviewed')
          if len(failures)==len(sources): raise SystemExit('No primary article bytes retrieved')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: insect-open-science-evidence-7d6a
          path: open-science-evidence/
          retention-days: 7
          if-no-files-found: error
