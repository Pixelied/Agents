name: Fetch insect modeling reference images

on:
  push:
    branches:
      - temp/insect-reference-image-fetch-20260919
    paths:
      - ".github/workflows/insect-reference-image-fetch.yml"
      - "tools/insect-reference-fetch.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install helpers
        run: |
          sudo apt-get update -y
          sudo apt-get install -y poppler-utils
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4 pillow

      - name: Fetch references
        run: python tools/insect-reference-fetch.py

      - name: Verify pack
        run: |
          test -s reference-images/MANIFEST.csv
          cd reference-images
          sha256sum -c SHA256SUMS.txt
          cat FETCH_REPORT.json
          find . -type f -printf '%s %p\n' | sort -nr | head -60

      - name: Upload reference pack
        uses: actions/upload-artifact@v4
        with:
          name: insect-model-reference-images-r1
          path: reference-images
          compression-level: 6
          if-no-files-found: error
          retention-days: 30
