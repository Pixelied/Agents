name: Fetch insect modeling reference images

on:
  push:
    branches:
      - temp/insect-reference-image-fetch-20260919
    paths:
      - ".github/workflows/insect-reference-image-fetch.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install helpers
        run: |
          sudo apt-get update -y
          sudo apt-get install -y poppler-utils
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4 pillow

      - name: Fetch reusable modeling references
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import csv, hashlib, html, json, re, subprocess
          from pathlib import Path
          from urllib.parse import urljoin, quote
          import requests
          from bs4 import BeautifulSoup

          ROOT = Path("reference-images")
          for p in [
              ROOT/"ants/linepithema_humile/worker",
              ROOT/"ants/linepithema_humile/queen",
              ROOT/"ants/linepithema_humile/male",
              ROOT/"ants/linepithema_humile/brood",
              ROOT/"drosophila_melanogaster/adult",
              ROOT/"drosophila_melanogaster/larva",
              ROOT/"drosophila_melanogaster/pupa",
              ROOT/"blattella_germanica/adult",
              ROOT/"blattella_germanica/nymph",
              ROOT/"cimex_lectularius/adult",
              ROOT/"cimex_lectularius/nymph",
              ROOT/"tribolium_castaneum/adult",
              ROOT/"tribolium_castaneum/pupa",
              ROOT/"source-pdfs",
          ]:
              p.mkdir(parents=True, exist_ok=True)

          S = requests.Session()
          S.headers.update({"User-Agent":"InsectRealism-reference-fetch/1.0 (+research; noncommercial)"})
          rows = []
          warnings = []

          def sha256(path: Path):
              h=hashlib.sha256()
              with path.open("rb") as f:
                  for ch in iter(lambda:f.read(1024*1024), b""): h.update(ch)
              return h.hexdigest()

          def dl(url: str, path: Path, min_bytes=1000):
              r=S.get(url, timeout=120)
              r.raise_for_status()
              path.write_bytes(r.content)
              if path.stat().st_size < min_bytes:
                  raise RuntimeError(f"{path}: unexpectedly small {path.stat().st_size}")
              return path

          def add(path, species, stage, view, source_url, source_name, author, license_name, license_url, use, authority, notes=""):
              path=Path(path)
              rows.append({
                  "local_file": path.relative_to(ROOT).as_posix() if path.exists() else "",
                  "species":species, "stage_or_form":stage, "view":view,
                  "source_name":source_name, "source_url":source_url,
                  "author_credit":author, "license":license_name, "license_url":license_url,
                  "intended_use":use, "geometry_authority":authority,
                  "bytes":path.stat().st_size if path.exists() else "",
                  "sha256":sha256(path) if path.exists() else "",
                  "notes":notes
              })

          commons = [
              ("Linepithema humile casent0005323 dorsal 1.jpg", ROOT/"ants/linepithema_humile/worker/worker_CASENT0005323_dorsal.jpg",
               "Linepithema humile","mature worker","dorsal","geometry","HIGH"),
              ("Linepithema humile casent0005323 profile 1.jpg", ROOT/"ants/linepithema_humile/worker/worker_CASENT0005323_profile.jpg",
               "Linepithema humile","mature worker","profile","geometry","HIGH"),
              ("Linepithema humile casent0005323 head 1.jpg", ROOT/"ants/linepithema_humile/worker/worker_CASENT0005323_head.jpg",
               "Linepithema humile","mature worker","head","geometry","HIGH"),
              ("Drosophila melanogaster (mosca de la fruta) vista lateral, bajo el microscopio electrónico de barrido.jpg",
               ROOT/"drosophila_melanogaster/adult/adult_SEM_head_thorax.jpg",
               "Drosophila melanogaster","adult","SEM closeup","surface detail; head/thorax morphology","MEDIUM"),
              ("Drosophila 2nd instar larva.jpg", ROOT/"drosophila_melanogaster/larva/L2_reference.jpg",
               "Drosophila melanogaster","larva L2","lateral","stage morphology; material","MEDIUM"),
              ("Fruit Fly Pupa.jpg", ROOT/"drosophila_melanogaster/pupa/pupa_reference.jpg",
               "Drosophila melanogaster","pupa","lateral","stage morphology; material","MEDIUM"),
              ("Drosophila melanogaster life cycle.jpg", ROOT/"drosophila_melanogaster/life_cycle_context.jpg",
               "Drosophila melanogaster","life cycle","multi-stage","context; relative morphology only","LOW"),
              ("Blatella germanica cdc.jpg", ROOT/"blattella_germanica/adult/female_with_ootheca_CDC.jpg",
               "Blattella germanica","adult female + ootheca","dorsal","adult/reproductive morphology","HIGH"),
              ("Blattella germanica 1236168.jpg", ROOT/"blattella_germanica/adult/adult_reference.jpg",
               "Blattella germanica","adult","dorsal/oblique","adult geometry; material","MEDIUM"),
              ("Cimex lectularius.jpg", ROOT/"cimex_lectularius/adult/adult_CDC_PD.jpg",
               "Cimex lectularius","adult","dorsal","geometry; material","HIGH"),
              ("Red flour beetle Tribolium castaneum.png", ROOT/"tribolium_castaneum/adult/adult_larva_comparison.png",
               "Tribolium castaneum","adult/larva reference","comparison","morphology/context","MEDIUM"),
              ("201703 Red flour beetle pupa.svg", ROOT/"tribolium_castaneum/pupa/pupa_reference.svg",
               "Tribolium castaneum","pupa","illustration","pupa morphology context","LOW"),
              ("Tribolium.castaneum.jpg", ROOT/"tribolium_castaneum/adult/adult_reference.jpg",
               "Tribolium castaneum","adult","dorsal/oblique","adult geometry; material","MEDIUM"),
          ]
          api="https://commons.wikimedia.org/w/api.php"
          for filename,path,species,stage,view,use,authority in commons:
              q={"action":"query","format":"json","prop":"imageinfo","iiprop":"url|extmetadata","titles":"File:"+filename}
              try:
                  response=S.get(api,params=q,timeout=60)
                  response.raise_for_status()
                  data=response.json()
                  page=next(iter(data["query"]["pages"].values()))
                  ii=page["imageinfo"][0]
                  meta=ii.get("extmetadata",{})
                  file_url=ii["url"]
                  dl(file_url,path)
                  lic=html.unescape(meta.get("LicenseShortName",{}).get("value",""))
                  licurl=meta.get("LicenseUrl",{}).get("value","")
                  artist=re.sub("<[^>]+>","",html.unescape(meta.get("Artist",{}).get("value",""))).strip()
                  src="https://commons.wikimedia.org/wiki/File:"+quote(filename.replace(" ","_"))
                  add(path,species,stage,view,src,"Wikimedia Commons / original provider",
                      artist,lic,licurl,use,authority,
                      "Measured R3 dimensions remain authoritative for scale; do not infer mm from pixels.")
              except Exception as e:
                  warnings.append(f"Commons fetch failed for {filename}: {e}")

          cdc = [
              (12703, ROOT/"cimex_lectularius/nymph/nymph_PHIL12703_PD.jpg","Cimex lectularius","nymph","dorsal","nymph geometry/material","HIGH"),
              (12704, ROOT/"cimex_lectularius/adult/adult_PHIL12704_PD.jpg","Cimex lectularius","adult","dorsal","adult geometry/material","HIGH"),
              (12705, ROOT/"cimex_lectularius/adult/head_thorax_PHIL12705_PD.jpg","Cimex lectularius","adult","head/thorax closeup","surface anatomy","MEDIUM"),
              (15247, ROOT/"cimex_lectularius/adult/male_female_PHIL15247_PD.jpg","Cimex lectularius","adult male + female","dorsal comparison","sexual dimorphism","HIGH"),
              (26933, ROOT/"blattella_germanica/nymph/nymph_stages_PHIL26933_PD.jpg","Blattella germanica","nymph stages","dorsal comparison","nymph-stage morphology/context","HIGH"),
              (26930, ROOT/"blattella_germanica/life_cycle_PHIL26930_PD.jpg","Blattella germanica","life cycle","illustration","life-cycle context","LOW"),
              (6324, ROOT/"blattella_germanica/adult/male_female_PHIL6324_PD.jpg","Blattella germanica","adult male + female","dorsal comparison","sexual dimorphism","HIGH"),
              (28479, ROOT/"blattella_germanica/adult/adult_dorsal_PHIL28479_PD.jpg","Blattella germanica","adult","dorsal","adult geometry/material","HIGH"),
          ]

          def find_hires(page_url):
              r=S.get(page_url,timeout=60); r.raise_for_status()
              soup=BeautifulSoup(r.text,"html.parser")
              for a in soup.find_all("a",href=True):
                  txt=" ".join(a.stripped_strings).lower()
                  if "hi-resolution" in txt or "high resolution" in txt:
                      return urljoin(page_url,a["href"])
              for m in re.finditer(r'https?://[^"\\']+\\.(?:jpg|jpeg|png|tif|tiff)',r.text,re.I):
                  return html.unescape(m.group(0))
              for a in soup.find_all("a",href=True):
                  href=urljoin(page_url,a["href"])
                  if re.search(r'\\.(?:jpg|jpeg|png|tif|tiff)(?:\\?|$)',href,re.I):
                      return href
              raise RuntimeError("No high resolution image link found")

          for pid,path,species,stage,view,use,authority in cdc:
              page=f"https://wwwn.cdc.gov/phil/Details.aspx?pid={pid}"
              try:
                  hires=find_hires(page)
                  dl(hires,path)
                  add(path,species,stage,view,page,"CDC Public Health Image Library","CDC",
                      "Public domain","https://creativecommons.org/publicdomain/mark/1.0/",
                      use,authority,"PHIL detail page states Copyright Restrictions: None.")
              except Exception as e:
                  warnings.append(f"CDC PHIL {pid} fetch failed: {e}")

          paper_url="https://www.scielo.cl/pdf/bres/v43n1/art04.pdf"
          pdf=ROOT/"source-pdfs/solis_2010_linepithema_immatures.pdf"
          try:
              dl(paper_url,pdf,min_bytes=100000)
              add(pdf,"Linepithema humile","egg/larvae/pupae","paper PDF",paper_url,
                  "Solis et al. 2010 / SciELO","Solis et al.",
                  "CC BY 4.0","https://creativecommons.org/licenses/by/4.0/",
                  "source authority for brood geometry and stage identification","HIGH",
                  "Use R3 corrected worker-vs-male larval labels.")
              pages={}
              for pnum in range(1,25):
                  try:
                      txt=subprocess.check_output(["pdftotext","-f",str(pnum),"-l",str(pnum),str(pdf),"-"],
                                                  text=True,stderr=subprocess.DEVNULL)
                  except Exception:
                      break
                  lo=txt.lower()
                  if ("fig. 1" in lo or "figure 1" in lo) and 1 not in pages: pages[1]=pnum
                  if ("fig. 8" in lo or "figure 8" in lo) and 8 not in pages: pages[8]=pnum
              for figno,stage,use in [(1,"worker/male larval stages","larval geometry and stage comparison"),
                                      (8,"worker/male pupae","pupal geometry and sex comparison")]:
                  pnum=pages.get(figno)
                  if not pnum:
                      warnings.append(f"SciELO: could not locate Figure {figno} page")
                      continue
                  prefix=ROOT/f"ants/linepithema_humile/brood/solis2010_figure{figno}_page"
                  subprocess.check_call(["pdftoppm","-f",str(pnum),"-l",str(pnum),"-r","220","-png","-singlefile",str(pdf),str(prefix)])
                  out=Path(str(prefix)+".png")
                  add(out,"Linepithema humile",stage,f"paper page containing Figure {figno}",
                      paper_url,"Solis et al. 2010 / SciELO","Solis et al.",
                      "CC BY 4.0","https://creativecommons.org/licenses/by/4.0/",
                      use,"HIGH","Whole page render retained so caption/labels stay attached; crop only after manual review.")
          except Exception as e:
              warnings.append(f"SciELO brood paper fetch/render failed: {e}")

          antweb_specs=[
              ("CASENT0246288","queen",ROOT/"ants/linepithema_humile/queen"),
              ("CASENT0724858","male",ROOT/"ants/linepithema_humile/male"),
          ]
          for specimen,form,outdir in antweb_specs:
              candidates=[
                  f"https://www.antweb.org/specimenImages.do?name={specimen.lower()}",
                  f"https://www.antweb.org/specimen.do?name={specimen.lower()}",
              ]
              found=[]
              for page in candidates:
                  try:
                      r=S.get(page,timeout=60); r.raise_for_status()
                      soup=BeautifulSoup(r.text,"html.parser")
                      for tag in soup.find_all(["img","a"]):
                          u=tag.get("src") or tag.get("href")
                          if not u: continue
                          u=urljoin(page,u)
                          if re.search(r'\\.(?:jpg|jpeg)(?:\\?|$)',u,re.I) and ("antweb" in u.lower() or specimen.lower() in u.lower()):
                              if u not in found: found.append(u)
                  except Exception as e:
                      warnings.append(f"AntWeb page {page} failed: {e}")
              kept=0
              for u in found:
                  if kept>=4: break
                  low=u.lower()
                  if "label" in low or "thumb" in low: continue
                  try:
                      dest=outdir/f"{form}_{specimen}_{kept+1}.jpg"
                      dl(u,dest,min_bytes=10000)
                      add(dest,"Linepithema humile",form,"AntWeb specimen image",
                          f"https://www.antweb.org/specimen.do?name={specimen.lower()}",
                          "AntWeb", "AntWeb photographer / specimen record",
                          "CC BY 4.0","https://creativecommons.org/licenses/by/4.0/",
                          f"{form} geometry reference","HIGH",
                          "Exact target species/form; measured R3 dimensions remain scale authority.")
                      kept+=1
                  except Exception as e:
                      warnings.append(f"AntWeb image failed {u}: {e}")
              if kept==0:
                  warnings.append(f"AntWeb {form} {specimen}: no downloadable full-size image discovered; keep source page as link-only authority.")

          gaps = ROOT/"LINK_ONLY_REFERENCES.md"
          gaps.write_text("""# Link-only / unresolved reference gaps

These are deliberately not replaced with generic or generated biology.

- Argentine-ant callow worker: acquire a direct target-species callow/teneral photograph before using a photo as calibrated color authority.
- If exact AntWeb queen/male files were not downloaded, use the specimen pages:
  - Queen CASENT0246288: https://www.antweb.org/specimen.do?name=casent0246288
  - Male CASENT0724858: https://www.antweb.org/specimen.do?name=casent0724858
- German-cockroach first-instar locomotion is the calibrated stage. CDC nymph-stage photos are useful morphology/context, but do not assume a pictured later nymph is the first instar.
- Bed-bug instar 1-5 geometry remains governed by the measured R3 morphometrics; photos are supplemental.
- Tribolium adult leg-phase gait remains a research gate; images do not close it.
""")

          fields=["local_file","species","stage_or_form","view","source_name","source_url",
                  "author_credit","license","license_url","intended_use","geometry_authority",
                  "bytes","sha256","notes"]
          with (ROOT/"MANIFEST.csv").open("w",newline="",encoding="utf-8") as f:
              w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerows(rows)

          (ROOT/"FETCH_REPORT.json").write_text(json.dumps({
              "downloaded_entries":len(rows),
              "warnings":warnings,
              "policy":{
                  "measured_scale_authority":"R3 audited measurements/data",
                  "images":"supplement geometry/material/context only",
                  "no_generated_images_as_scientific_authority":True
              }
          },indent=2)+"\n")

          (ROOT/"README.md").write_text("""# Insect modeling reference images

This folder is a curated modeling reference pack for Codex/Astra.

## Authority order
1. Audited R3 measurements and provenance control scale and calibrated biology.
2. Exact-species / exact-stage scientific or specimen images guide geometry.
3. Natural photographs guide material/color/posture.
4. Life-cycle illustrations and comparison plates are context only.
5. Generated imagery is never scientific authority.

Read MANIFEST.csv before using any file. It records the exact species/stage, source,
license, intended use, and authority level.

Do not average unrelated species, life stages, sexes, castes, or feeding states into one model.
""")

          with (ROOT/"SHA256SUMS.txt").open("w") as f:
              for p in sorted(ROOT.rglob("*")):
                  if p.is_file() and p.name!="SHA256SUMS.txt":
                      f.write(f"{sha256(p)}  {p.relative_to(ROOT).as_posix()}\n")

          print(json.dumps({"entries":len(rows),"warnings":warnings},indent=2))
          PY

      - name: Verify reference pack
        shell: bash
        run: |
          set -euo pipefail
          test -s reference-images/MANIFEST.csv
          (
            cd reference-images
            sha256sum -c SHA256SUMS.txt
          )
          find reference-images -type f -printf '%s %p\n' | sort -nr | head -50
          cat reference-images/FETCH_REPORT.json

      - name: Upload reference pack
        uses: actions/upload-artifact@v4
        with:
          name: insect-model-reference-images-r1
          path: reference-images
          compression-level: 6
          if-no-files-found: error
          retention-days: 30
