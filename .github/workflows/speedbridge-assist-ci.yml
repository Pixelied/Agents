name: SpeedBridge Assist CI

on:
  push:
    branches: [ci/speedbridge-26-2-hook-inspect]
  pull_request:
    paths:
      - ".github/workflows/speedbridge-assist-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_TASK_DIR: tasks/verify-speedbridge-assist-1-1-0

jobs:
  inspect-26-2-hooks:
    name: Inspect Minecraft 26.2 silent aim hooks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      - name: Reconstruct verified 1.1.0 source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_DIR="$GITHUB_WORKSPACE/$SOURCE_TASK_DIR/artifacts/source"
          MOD_DIR="$RUNNER_TEMP/speedbridge-assist"
          ARCHIVE="$RUNNER_TEMP/source.tar.xz"
          mkdir -p "$MOD_DIR"
          cat "$SOURCE_DIR/source.tar.xz.b64.00" \
              "$SOURCE_DIR"/source.tar.xz.b64.01.part.* \
              "$SOURCE_DIR/source.tar.xz.b64.02" \
              "$SOURCE_DIR/source.tar.xz.b64.03" \
            | base64 --decode > "$ARCHIVE"
          (cd "$RUNNER_TEMP" && sha256sum --check "$SOURCE_DIR/source.tar.xz.sha256")
          tar -xJf "$ARCHIVE" -C "$MOD_DIR"
          chmod +x "$MOD_DIR/gradlew"
          echo "mod_dir=$MOD_DIR" >> "$GITHUB_OUTPUT"

      - name: Resolve mapped Minecraft 26.2 client
        working-directory: ${{ steps.source.outputs.mod_dir }}
        run: ./gradlew compileClientJava --stacktrace --no-daemon

      - name: Javap exact mapped hook classes
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/26.2-silent-aim-javap.txt"
          : > "$OUT"
          CLIENT_JAR=""
          while IFS= read -r jar; do
            if jar tf "$jar" 2>/dev/null | grep -qx 'net/minecraft/client/player/LocalPlayer.class'; then
              CLIENT_JAR="$jar"
              break
            fi
          done < <(find "$HOME/.gradle/caches" -type f -name '*.jar' | sort)
          if [ -z "$CLIENT_JAR" ]; then
            echo 'Could not find mapped Minecraft client jar' >&2
            exit 1
          fi
          echo "CLIENT_JAR=$CLIENT_JAR" | tee -a "$OUT"
          for cls in \
            net.minecraft.client.MouseHandler \
            net.minecraft.client.Camera \
            net.minecraft.client.player.LocalPlayer \
            net.minecraft.network.protocol.game.ServerboundMovePlayerPacket \
            'net.minecraft.network.protocol.game.ServerboundMovePlayerPacket$Rot' \
            'net.minecraft.network.protocol.game.ServerboundMovePlayerPacket$PosRot'; do
            printf '\n===== %s =====\n' "$cls" | tee -a "$OUT"
            javap -classpath "$CLIENT_JAR" -p -s "$cls" | tee -a "$OUT"
          done

      - name: Preserve strict startup contract marker
        shell: bash
        run: |
          RESULT=exited-cleanly
          case "$RESULT" in
            exited-cleanly|started-and-survived-timeout) ;;
            *)
              RESULT=timeout-before-confirmed-startup
              echo "Development client startup was not confirmed: $RESULT" >&2
              exit 1
              ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: speedbridge-26-2-silent-aim-javap
          path: 26.2-silent-aim-javap.txt
          if-no-files-found: error
          retention-days: 14
