name: SpeedBridge Assist CI

on:
  push:
    branches: [ci/speedbridge-breezily-milestone-1-5]
  pull_request:
    paths:
      - ".github/workflows/speedbridge-assist-ci.yml"
      - "tasks/implement-speedbridge-breezily-silent-aim/**"
      - "tasks/verify-speedbridge-assist-1-1-0/artifacts/source/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_TASK_DIR: tasks/verify-speedbridge-assist-1-1-0
  TASK_DIR: tasks/implement-speedbridge-breezily-silent-aim
  PATCH_SHA256: 88befbd52d06f0d0ddf332a462ee058fd9e1fdfe5b0c8173f2b05a0f1a5ff56b

jobs:
  verify-mod:
    name: Java 25 Fabric milestone verification
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate coordination workspace
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -v
          python agentctl.py validate

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      - name: Reconstruct source and exact milestone patch
        id: source
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_DIR="$GITHUB_WORKSPACE/$SOURCE_TASK_DIR/artifacts/source"
          PATCH_DIR="$GITHUB_WORKSPACE/$TASK_DIR/artifacts/patches"
          RESULTS_DIR="$GITHUB_WORKSPACE/$TASK_DIR/artifacts/ci-results"
          MOD_DIR="$RUNNER_TEMP/speedbridge-assist"
          ARCHIVE="$RUNNER_TEMP/source.tar.xz"
          PATCH="$RUNNER_TEMP/milestone-1-5.patch"
          mkdir -p "$MOD_DIR" "$RESULTS_DIR"

          cat "$SOURCE_DIR/source.tar.xz.b64.00" \
              "$SOURCE_DIR"/source.tar.xz.b64.01.part.* \
              "$SOURCE_DIR/source.tar.xz.b64.02" \
              "$SOURCE_DIR/source.tar.xz.b64.03" \
            | base64 --decode > "$ARCHIVE"
          (cd "$RUNNER_TEMP" && sha256sum --check "$SOURCE_DIR/source.tar.xz.sha256") \
            | tee "$RESULTS_DIR/source-checksum.log"
          tar -xJf "$ARCHIVE" -C "$MOD_DIR"

          decode_corrected() {
            base64 --decode "$PATCH_DIR/corrected/part-$1.gz.b64" | gzip -dc
          }
          {
            cat "$PATCH_DIR/milestone-1-5.patch.part-00"
            cat "$PATCH_DIR/milestone-1-5.patch.part-01"
            cat "$PATCH_DIR/milestone-1-5.patch.part-02"
            decode_corrected 03
            cat "$PATCH_DIR/milestone-1-5.patch.part-04"
            cat "$PATCH_DIR/milestone-1-5.patch.part-05"
            cat "$PATCH_DIR/milestone-1-5.patch.part-06"
            decode_corrected 07
            decode_corrected 08
            decode_corrected 09
            decode_corrected 10
            cat "$PATCH_DIR/milestone-1-5.patch.part-11"
          } > "$PATCH"
          printf '%s  %s\n' "$PATCH_SHA256" "$PATCH" | sha256sum --check \
            | tee "$RESULTS_DIR/patch-checksum.log"
          (cd "$MOD_DIR" && git apply --check "$PATCH")
          (cd "$MOD_DIR" && git apply "$PATCH")
          git apply --numstat "$PATCH" | tee "$RESULTS_DIR/patch-numstat.log"

          echo "mod_dir=$MOD_DIR" >> "$GITHUB_OUTPUT"
          echo "results_dir=$RESULTS_DIR" >> "$GITHUB_OUTPUT"

      - name: Verify Java and Gradle
        working-directory: ${{ steps.source.outputs.mod_dir }}
        run: |
          set -euo pipefail
          chmod +x gradlew tools/*.sh
          java -version 2>&1 | tee "${{ steps.source.outputs.results_dir }}/java-version.log"
          ./gradlew --version --no-daemon | tee "${{ steps.source.outputs.results_dir }}/gradle-version.log"

      - name: Run deterministic and source-guard tests
        working-directory: ${{ steps.source.outputs.mod_dir }}
        run: |
          set -euo pipefail
          ./tools/run-standalone-tests.sh | tee "${{ steps.source.outputs.results_dir }}/standalone-tests.log"
          ./tools/check-26.2-api.sh | tee "${{ steps.source.outputs.results_dir }}/source-guard.log"

      - name: Run Java 25 Gradle tests
        working-directory: ${{ steps.source.outputs.mod_dir }}
        run: |
          set -euo pipefail
          ./gradlew clean test --stacktrace --no-daemon 2>&1 \
            | tee "${{ steps.source.outputs.results_dir }}/gradle-test.log"

      - name: Build and inspect production mod
        working-directory: ${{ steps.source.outputs.mod_dir }}
        shell: bash
        run: |
          set -euo pipefail
          RESULTS_DIR="${{ steps.source.outputs.results_dir }}"
          ./gradlew clean build --stacktrace --no-daemon 2>&1 | tee "$RESULTS_DIR/gradle-build.log"
          mapfile -t JARS < <(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' | sort)
          test "${#JARS[@]}" -eq 1
          mkdir -p "$RESULTS_DIR/jar"
          cp "${JARS[0]}" "$RESULTS_DIR/jar/"
          sha256sum "${JARS[0]}" | tee "$RESULTS_DIR/jar.sha256"
          unzip -p "${JARS[0]}" fabric.mod.json | tee "$RESULTS_DIR/fabric.mod.json"
          unzip -l "${JARS[0]}" > "$RESULTS_DIR/jar-contents.txt"

      - name: Install virtual display
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends xvfb xauth

      - name: Confirm headless development-client startup
        id: smoke
        working-directory: ${{ steps.source.outputs.mod_dir }}
        shell: bash
        run: |
          set -uo pipefail
          RESULTS_DIR="${{ steps.source.outputs.results_dir }}"
          LOG="$RESULTS_DIR/run-client.log"
          set +e
          timeout --signal=TERM --kill-after=15s 120s xvfb-run -a \
            ./gradlew runClient --stacktrace --no-daemon >"$LOG" 2>&1
          STATUS=$?
          set -e
          if [ "$STATUS" -eq 0 ]; then
            RESULT=exited-cleanly
          elif [ "$STATUS" -eq 124 ] || [ "$STATUS" -eq 137 ]; then
            if grep -Eiq 'Backend library: LWJGL|Reloading ResourceManager|Created: [0-9]+x[0-9]+|Created texture atlas|Sound engine started' "$LOG"; then
              RESULT=started-and-survived-timeout
            else
              RESULT=timeout-before-confirmed-startup
            fi
          else
            RESULT=failed
          fi
          printf 'exit_code=%s\nresult=%s\n' "$STATUS" "$RESULT" | tee "$RESULTS_DIR/run-client-status.txt"
          case "$RESULT" in
            exited-cleanly|started-and-survived-timeout) ;;
            *)
              echo "Development client startup was not confirmed: $RESULT (exit code $STATUS)" >&2
              exit 1
              ;;
          esac

      - name: Collect evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          MOD_DIR="$RUNNER_TEMP/speedbridge-assist"
          RESULTS_DIR="$GITHUB_WORKSPACE/$TASK_DIR/artifacts/ci-results"
          mkdir -p "$RESULTS_DIR/gradle-reports" "$RESULTS_DIR/runtime"
          [ ! -d "$MOD_DIR/build/reports/tests" ] || cp -R "$MOD_DIR/build/reports/tests" "$RESULTS_DIR/gradle-reports/"
          [ ! -d "$MOD_DIR/build/test-results" ] || cp -R "$MOD_DIR/build/test-results" "$RESULTS_DIR/gradle-reports/"
          [ ! -d "$MOD_DIR/run/logs" ] || cp -R "$MOD_DIR/run/logs" "$RESULTS_DIR/runtime/"
          [ ! -d "$MOD_DIR/run/crash-reports" ] || cp -R "$MOD_DIR/run/crash-reports" "$RESULTS_DIR/runtime/"

      - name: Upload production JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: speedbridge-assist-milestone-1-5-jar
          path: ${{ env.TASK_DIR }}/artifacts/ci-results/jar/*.jar
          if-no-files-found: error
          retention-days: 14

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: speedbridge-assist-milestone-1-5-verification
          path: |
            ${{ env.TASK_DIR }}/artifacts/ci-results/**
            ${{ env.TASK_DIR }}/artifacts/patches/corrected/**
            ${{ env.SOURCE_TASK_DIR }}/artifacts/source/README.md
            ${{ env.SOURCE_TASK_DIR }}/artifacts/source/source.tar.xz.sha256
          if-no-files-found: warn
          retention-days: 14
