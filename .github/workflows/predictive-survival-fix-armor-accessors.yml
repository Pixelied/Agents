name: Predictive Survival fix armor accessors

on:
  push:
    branches:
      - feat/predictive-survival-contingency-planner
    paths:
      - .github/workflows/predictive-survival-fix-armor-accessors.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/predictive-survival-contingency-planner
          fetch-depth: 0

      - name: Patch stale ArmorPieceSnapshot accessors
        shell: bash
        run: |
          set -euo pipefail
          file='projects/predictive-survival-26-1-2/src/client/java/dev/pixelied/survival/execution/NonTotemActionExecutor.java'
          sed -i 's/enchantmentProtectionSnapshots()/protectionEnchantments()/g' "$file"
          sed -i 's/durabilityResistantDamageTypes()/durabilityResistantDamageTypeKeys()/g' "$file"
          ! grep -q 'enchantmentProtectionSnapshots()' "$file"
          ! grep -q 'durabilityResistantDamageTypes()' "$file"
          grep -q 'actual.protectionEnchantments().equals(planned.protectionEnchantments())' "$file"
          grep -q 'actual.durabilityResistantDamageTypeKeys().equals(planned.durabilityResistantDamageTypeKeys())' "$file"
          git diff --check

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Verify unit build before commit
        working-directory: projects/predictive-survival-26-1-2
        run: ./gradlew --no-daemon clean test build

      - name: Commit accessor fix
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No accessor fix needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/predictive-survival-26-1-2/src/client/java/dev/pixelied/survival/execution/NonTotemActionExecutor.java
          git commit -m 'fix: align armor capability accessors'
          git push origin HEAD:feat/predictive-survival-contingency-planner
