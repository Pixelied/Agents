name: Insect Tasks 6-16 verification environment
on:
  push:
    branches: [feat/insect-tasks-06-16-20260918-b7c4]
    paths: [.github/workflows/insect-0616.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  software-vulkan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Install software Vulkan
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers vulkan-tools
      - name: Export runtime libraries
        shell: bash
        run: |
          mkdir -p export/lib export/icd
          python3 - <<'PY'
          import pathlib, subprocess, shutil, re, json
          roots=[pathlib.Path('/usr/lib/x86_64-linux-gnu/libvulkan.so.1'), pathlib.Path('/usr/lib/x86_64-linux-gnu/libvulkan_lvp.so')]
          found=set()
          for root in roots:
              found.add(root)
              text=subprocess.check_output(['ldd',str(root)],text=True)
              for raw in re.findall(r'=> (/\S+)',text): found.add(pathlib.Path(raw))
          for p in sorted(found):
              if p.name.startswith(('libc.so','libm.so','libpthread.so','librt.so','libdl.so','ld-linux')): continue
              shutil.copy2(p,'export/lib/'+p.name)
          pathlib.Path('export/icd/lvp.json').write_text(json.dumps({'file_format_version':'1.0.0','ICD':{'library_path':'../lib/libvulkan_lvp.so','api_version':'1.3.0'}}))
          shutil.copy2('/usr/bin/vulkaninfo','export/vulkaninfo')
          PY
          VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json vulkaninfo --summary > export/runner-vulkan-summary.txt 2>&1 || true
          tar -czf insect-software-vulkan.tar.gz -C export .
          sha256sum insect-software-vulkan.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: insect-software-vulkan
          path: insect-software-vulkan.tar.gz
          retention-days: 2
