name: Vape 4.21 isolated Minecraft smoke
on:
  push:
    branches:
      - project/vape421-fabric-clean-build-20261123
    paths:
      - 'projects/vape421-fabric-clean-build/minecraft_smoke.py'
      - '.github/workflows/vape421-minecraft-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  minecraft-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: vape421-fabric-linux-x64
          run-id: 45314168947
          github-token: ${{ github.token }}
          path: test-mod
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install disposable display
        run: sudo apt-get update -q && sudo apt-get install -y xvfb xauth xdotool scrot libgl1-mesa-dri libglx-mesa0 libasound2t64
      - name: Launch real Minecraft demo and test Fabric world initialization
        run: xvfb-run -a -s "-screen 0 1280x720x24" python -u projects/vape421-fabric-clean-build/minecraft_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minecraft-26.2-smoke-evidence
          path: smoke-results/
          if-no-files-found: warn
          retention-days: 7
