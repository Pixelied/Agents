name: Build Natural Aim Assist 26.2

on:
  push:
    branches:
      - project/natural-aim-assist-26-2
    paths:
      - "projects/natural-aim-assist-26.2/**"
      - ".github/workflows/natural-aim-assist-26-2.yml"
  pull_request:
    paths:
      - "projects/natural-aim-assist-26.2/**"
      - ".github/workflows/natural-aim-assist-26-2.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: projects/natural-aim-assist-26.2

    steps:
      - uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.5.1"

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 9.5.1 --no-validate-url

      - name: Clean build and deterministic simulations
        run: ./gradlew clean check build --stacktrace

      - name: Smoke-launch Fabric 26.2 client
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p build
          set +e
          timeout 90s xvfb-run -a ./gradlew runClient --no-daemon > build/client-smoke.log 2>&1
          STATUS=$?
          set -e

          if [ "$STATUS" -ne 124 ]; then
            echo "ERROR: client exited before the smoke-test timeout (status $STATUS)"
            tail -n 250 build/client-smoke.log || true
            exit 1
          fi

          test -f run/logs/latest.log
          if grep -E -i 'NoSuch(Method|Field)Error|ClassNotFoundException|ClassCastException|Mixin.*(failed|error)|Exception in thread|Crash report' run/logs/latest.log; then
            echo "ERROR: runtime linkage/mixin/crash signature found during client smoke launch"
            tail -n 250 run/logs/latest.log
            exit 1
          fi

          echo "Fabric client stayed alive through the smoke window without linkage, mixin, or crash signatures."

      - name: Verify remapped JAR metadata
        shell: bash
        run: |
          set -euo pipefail
          JAR="build/libs/natural-aim-assist-1.1.3.jar"
          test -f "$JAR"
          jar tf "$JAR" | tee build/jar-contents.txt

          if grep -Eq 'AimMathSimulation|src/test|(^|/)test/' build/jar-contents.txt; then
            echo "ERROR: test/development classes were packaged in the final JAR"
            exit 1
          fi

          unzip -p "$JAR" fabric.mod.json | tee build/fabric.mod.final.json
          grep -F '"environment": "client"' build/fabric.mod.final.json
          grep -F '"minecraft": "~26.2"' build/fabric.mod.final.json
          grep -F '"fabric-api": ">=0.160.0+26.2"' build/fabric.mod.final.json
          grep -F '"modmenu"' build/fabric.mod.final.json
          grep -F 'dev.adrien.naturalaim.modmenu.NaturalAimModMenu' build/fabric.mod.final.json

      - name: Upload Natural Aim Assist JAR
        uses: actions/upload-artifact@v4
        with:
          name: natural-aim-assist-26.2-1.1.3
          path: projects/natural-aim-assist-26.2/build/libs/natural-aim-assist-1.1.3.jar
          if-no-files-found: error
