name: Apply Predictive Survival route timing patch

on:
  push:
    branches:
      - feat/predictive-survival-contingency-planner

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/predictive-survival-contingency-planner
          fetch-depth: 0
      - name: Apply exact route timing fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          route_file = Path('projects/predictive-survival-26-1-2/src/client/java/dev/pixelied/survival/inventory/SurvivalItemRoute.java')
          text = route_file.read_text()
          old = '''    record ContainerSwap(\n        int sourceInventoryIndex,\n        int sourceMenuSlot,\n        int destinationInventoryIndex,\n        int button,\n        SurvivalAction.Hand destinationHand,\n        String itemKey,\n        int componentFingerprint\n    ) implements SurvivalItemRoute {\n        public ContainerSwap {\n            if (sourceInventoryIndex < 0 || sourceInventoryIndex > 40 || sourceMenuSlot < 0) {\n                throw new IllegalArgumentException("source inventory/menu slot must be valid");\n            }\n            if (destinationInventoryIndex < 0 || destinationInventoryIndex > 40) {\n                throw new IllegalArgumentException("destination inventory slot must be valid");\n            }\n            if (!((button >= 0 && button <= 8) || button == 40)) {\n                throw new IllegalArgumentException("swap button must be hotbar 0..8 or offhand 40");\n            }\n            destinationHand = Objects.requireNonNull(destinationHand, "destinationHand");\n            itemKey = requireItemKey(itemKey);\n        }\n\n        @Override public int requiredServerTicks() { return 1; }\n    }\n'''
          new = '''    record ContainerSwap(\n        int sourceInventoryIndex,\n        int sourceMenuSlot,\n        int destinationInventoryIndex,\n        int button,\n        SurvivalAction.Hand destinationHand,\n        String itemKey,\n        int componentFingerprint,\n        int requiredServerTicks\n    ) implements SurvivalItemRoute {\n        public ContainerSwap(\n            int sourceInventoryIndex,\n            int sourceMenuSlot,\n            int destinationInventoryIndex,\n            int button,\n            SurvivalAction.Hand destinationHand,\n            String itemKey,\n            int componentFingerprint\n        ) {\n            this(sourceInventoryIndex, sourceMenuSlot, destinationInventoryIndex, button, destinationHand,\n                itemKey, componentFingerprint, 1);\n        }\n\n        public ContainerSwap {\n            if (sourceInventoryIndex < 0 || sourceInventoryIndex > 40 || sourceMenuSlot < 0) {\n                throw new IllegalArgumentException("source inventory/menu slot must be valid");\n            }\n            if (destinationInventoryIndex < 0 || destinationInventoryIndex > 40) {\n                throw new IllegalArgumentException("destination inventory slot must be valid");\n            }\n            if (!((button >= 0 && button <= 8) || button == 40)) {\n                throw new IllegalArgumentException("swap button must be hotbar 0..8 or offhand 40");\n            }\n            if (requiredServerTicks < 0) throw new IllegalArgumentException("requiredServerTicks must be non-negative");\n            destinationHand = Objects.requireNonNull(destinationHand, "destinationHand");\n            itemKey = requireItemKey(itemKey);\n        }\n    }\n'''
          if old not in text:
              raise SystemExit('ContainerSwap route target changed; refusing blind patch')
          route_file.write_text(text.replace(old, new, 1))

          planner = Path('projects/predictive-survival-26-1-2/src/client/java/dev/pixelied/survival/inventory/SurvivalItemRoutePlanner.java')
          text = planner.read_text()
          old = '''    public Optional<SurvivalItemRoute> route(\n        InventorySnapshot inventory,\n        MenuSlotMap menu,\n        InventorySlotSnapshot source,\n        boolean inventoryRouting,\n        boolean mainHandTakeover\n    ) {\n        Objects.requireNonNull(inventory, "inventory");\n        Objects.requireNonNull(menu, "menu");\n        Objects.requireNonNull(source, "source");\n        if (source.count() <= 0) return Optional.empty();\n'''
          new = '''    public Optional<SurvivalItemRoute> route(\n        InventorySnapshot inventory,\n        MenuSlotMap menu,\n        InventorySlotSnapshot source,\n        boolean inventoryRouting,\n        boolean mainHandTakeover\n    ) {\n        return route(inventory, menu, source, inventoryRouting, mainHandTakeover, 1);\n    }\n\n    public Optional<SurvivalItemRoute> route(\n        InventorySnapshot inventory,\n        MenuSlotMap menu,\n        InventorySlotSnapshot source,\n        boolean inventoryRouting,\n        boolean mainHandTakeover,\n        int containerSwapTicks\n    ) {\n        Objects.requireNonNull(inventory, "inventory");\n        Objects.requireNonNull(menu, "menu");\n        Objects.requireNonNull(source, "source");\n        if (containerSwapTicks < 0) throw new IllegalArgumentException("containerSwapTicks must be non-negative");\n        if (source.count() <= 0) return Optional.empty();\n'''
          if old not in text:
              raise SystemExit('route planner signature changed; refusing blind patch')
          text = text.replace(old, new, 1)
          old_ctor = '''            SurvivalAction.Hand.MAIN_HAND,\n            source.stackKey(),\n            source.componentFingerprint()\n        ));\n'''
          new_ctor = '''            SurvivalAction.Hand.MAIN_HAND,\n            source.stackKey(),\n            source.componentFingerprint(),\n            containerSwapTicks\n        ));\n'''
          # Only the final container constructor is followed by the method/file close; replace last occurrence.
          pos = text.rfind(old_ctor)
          if pos < 0:
              raise SystemExit('container route constructor changed; refusing blind patch')
          text = text[:pos] + new_ctor + text[pos + len(old_ctor):]
          planner.write_text(text)

          generator = Path('projects/predictive-survival-26-1-2/src/client/java/dev/pixelied/survival/planner/SurvivalCandidateGenerator.java')
          text = generator.read_text()
          text = text.replace('addProtectionCandidate(candidates, inventory, menu, route)',
                              'addProtectionCandidate(candidates, context, inventory, menu, route)')
          text = text.replace('addProtectionCandidate(candidates, inventory, menu, value)',
                              'addProtectionCandidate(candidates, context, inventory, menu, value)')
          old_sig = '''    private static void addProtectionCandidate(\n        List<SurvivalAction> candidates,\n        InventorySnapshot inventory,\n        MenuSlotMap menu,\n        DeathProtectionRoute route\n    ) {\n'''
          new_sig = '''    private static void addProtectionCandidate(\n        List<SurvivalAction> candidates,\n        PredictionContext context,\n        InventorySnapshot inventory,\n        MenuSlotMap menu,\n        DeathProtectionRoute route\n    ) {\n'''
          if old_sig not in text:
              raise SystemExit('protection candidate signature changed; refusing blind patch')
          text = text.replace(old_sig, new_sig, 1)
          old_action = '''        candidates.add(new SurvivalAction.EquipDeathProtection(\n            item,\n            hand,\n            0,\n            true,\n'''
          new_action = '''        int requiredServerTicks = route instanceof DeathProtectionRoute.HotbarSelect\n            ? 1\n            : context.timing().serverCorrectionReturnTicks();\n        candidates.add(new SurvivalAction.EquipDeathProtection(\n            item,\n            hand,\n            requiredServerTicks,\n            true,\n'''
          if old_action not in text:
              raise SystemExit('protection action target changed; refusing blind patch')
          text = text.replace(old_action, new_action, 1)
          text = text.replace(
              'itemRoutePlanner.route(inventory, menu, slot, true, true)',
              'itemRoutePlanner.route(inventory, menu, slot, true, true, context.timing().containerFollowupRouteTicks())'
          )
          text = text.replace(
              'inventory, menu, slot, policy.inventoryRouting(), policy.mainHandTakeover()\n            )',
              'inventory, menu, slot, policy.inventoryRouting(), policy.mainHandTakeover(),\n                context.timing().containerFollowupRouteTicks()\n            )'
          )
          generator.write_text(text)
          PY
      - name: Commit patch and remove helper workflow
        run: |
          rm .github/workflows/ps-contingency-route-timing-patch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add projects/predictive-survival-26-1-2/src/client/java/dev/pixelied/survival/inventory/SurvivalItemRoute.java \
                  projects/predictive-survival-26-1-2/src/client/java/dev/pixelied/survival/inventory/SurvivalItemRoutePlanner.java \
                  projects/predictive-survival-26-1-2/src/client/java/dev/pixelied/survival/planner/SurvivalCandidateGenerator.java \
                  .github/workflows/ps-contingency-route-timing-patch.yml
          git commit -m 'fix: charge container reconciliation in rescue timing'
          git push origin HEAD:feat/predictive-survival-contingency-planner
