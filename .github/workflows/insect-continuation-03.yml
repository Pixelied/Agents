name: Insect Continuation 03 qualification
"on":
  push:
    branches: ['feat/insect-continuation-03-q7b4']
    paths: ['.github/workflows/insect-continuation-03.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: insect-continuation-03-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-reconciliation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Preserve repository objects and source identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/insect-reconciliation"
          git bundle create "$RUNNER_TEMP/insect-reconciliation/agents-history.bundle" --all
          git bundle verify "$RUNNER_TEMP/insect-reconciliation/agents-history.bundle"
          git for-each-ref --format='%(refname) %(objectname)' > "$RUNNER_TEMP/insect-reconciliation/refs.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/insect-reconciliation/checkout-commit.txt"
          cd "$RUNNER_TEMP/insect-reconciliation"
          sha256sum agents-history.bundle > SHA256SUMS.txt
      - name: Validate current coordination branch independently
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/insect-coordination" refs/remotes/origin/main
          cd "$RUNNER_TEMP/insect-coordination"
          python agentctl.py validate 2>&1 | tee "$RUNNER_TEMP/insect-reconciliation/workspace-validation.log"
          python -m unittest discover -s tests -v 2>&1 | tee "$RUNNER_TEMP/insect-reconciliation/workspace-tests.log"
      - name: Upload source reconciliation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: insect-source-reconciliation-q7b4
          path: ${{ runner.temp }}/insect-reconciliation/
          if-no-files-found: error
          retention-days: 30
